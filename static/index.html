<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acme Corp Support Agent</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .status {
    font-size: 12px;
    color: #94a3b8;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: #1e293b;
    border: 1px solid #334155;
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    color: #64748b;
    font-size: 12px;
  }
  #inputBar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: #1e293b;
    border-top: 1px solid #334155;
  }
  #inputBar input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
  }
  #inputBar input:focus {
    border-color: #2563eb;
  }
  #inputBar button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  #inputBar button:disabled {
    background: #334155;
    cursor: not-allowed;
  }
  .typing {
    align-self: flex-start;
    color: #94a3b8;
    font-size: 13px;
    font-style: italic;
  }
</style>
</head>
<body>
  <header>
    <h1>Acme Corp Support Agent</h1>
    <span class="status" id="status">connecting…</span>
  </header>
  <div id="chat"></div>
  <div id="inputBar">
    <input id="messageInput" type="text" placeholder="Ask anything…" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    const sessionId = (() => {
      let id = localStorage.getItem("session_id");
      if (!id) {
        id = "web-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem("session_id", id);
      }
      return id;
    })();

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          statusEl.textContent = "online";
        } else {
          statusEl.textContent = "unreachable";
        }
      } catch {
        statusEl.textContent = "unreachable";
      }
    }
    checkHealth();

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage("user", text);
      inputEl.value = "";
      sendBtn.disabled = true;

      const typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.textContent = "Agent is thinking…";
      chatEl.appendChild(typingEl);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": "__APP_API_KEY__",
          },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        typingEl.remove();

        if (!res.ok) {
          const err = await res.text();
          addMessage("system", "Error: " + err);
          return;
        }
        const data = await res.json();
        addMessage("ai", data.reply);
      } catch (e) {
        typingEl.remove();
        addMessage("system", "Network error: " + e.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    addMessage("system", "Session: " + sessionId);
  </script>
</body>
</html>
