<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acme Corp Support Agent</title>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #05040d;
    --bg-1: #0b0620;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-border: rgba(255, 255, 255, 0.09);
    --surface-hover: rgba(255, 255, 255, 0.075);
    --text: #ece9fb;
    --text-dim: #9a92c4;
    --text-faint: #6a638f;
    --accent-1: #7c5cff;
    --accent-2: #22d3ee;
    --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --online: #34e5a8;
    --danger: #ff6b81;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- animated space background ---------- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-1), var(--bg-0) 60%);
  }

  .nebula {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .nebula.a {
    width: 46vw; height: 46vw;
    background: radial-gradient(circle, var(--accent-1), transparent 70%);
    top: -12vw; left: -10vw;
    animation: drift-a 34s ease-in-out infinite;
  }
  .nebula.b {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    bottom: -14vw; right: -8vw;
    animation: drift-b 40s ease-in-out infinite;
  }
  .nebula.c {
    width: 28vw; height: 28vw;
    background: radial-gradient(circle, #ff5cc4, transparent 70%);
    top: 30%; right: 15%;
    opacity: 0.18;
    animation: drift-c 46s ease-in-out infinite;
  }

  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vw, 8vw) scale(1.15); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vw, -6vw) scale(1.1); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-4vw, 5vw) scale(1.2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula { animation: none !important; }
  }

  /* ---------- header ---------- */
  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(8, 5, 20, 0.55);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--surface-border);
    z-index: 2;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--accent-grad);
    box-shadow: 0 0 18px rgba(124, 92, 255, 0.55);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    box-shadow: 0 0 0 rgba(52, 229, 168, 0);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.online {
    background: var(--online);
    box-shadow: 0 0 10px 2px rgba(52, 229, 168, 0.55);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .status-dot.offline {
    background: var(--danger);
    box-shadow: 0 0 10px 2px rgba(255, 107, 129, 0.5);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ---------- chat area ---------- */
  #chatWrap {
    flex: 1;
    overflow-y: auto;
    z-index: 1;
  }
  #chat {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 100%;
  }

  .row {
    display: flex;
    gap: 10px;
    max-width: 100%;
    animation: rise 0.35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.user { flex-direction: row-reverse; align-self: flex-end; }
  .row.ai { align-self: flex-start; }
  .row.system { align-self: center; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
  }
  .avatar.ai {
    background: var(--accent-grad);
    color: #0b0620;
  }
  .avatar.user {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    border: 1px solid var(--surface-border);
  }

  .bubble {
    max-width: 66ch;
    padding: 12px 15px;
    border-radius: var(--radius);
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .row.user .bubble {
    background: var(--accent-grad);
    color: #0b0620;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }
  .row.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(10px);
    border-bottom-left-radius: 4px;
  }
  .row.system .bubble {
    background: transparent;
    color: var(--text-faint);
    font-size: 12px;
    padding: 4px 10px;
  }
  .bubble code {
    background: rgba(0, 0, 0, 0.35);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: 0.9em;
  }
  .bubble a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.4); }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 15px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    margin-left: 38px;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- input bar ---------- */
  #inputArea {
    z-index: 2;
    padding: 14px 20px 20px;
    background: linear-gradient(0deg, rgba(5,4,13,0.9) 40%, transparent);
  }
  #inputInner {
    max-width: 760px;
    margin: 0 auto;
  }

  #attachChip {
    display: none;
    align-items: center;
    gap: 8px;
    width: fit-content;
    margin: 0 0 8px 4px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  #attachChip.show { display: flex; }
  #attachChip button {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  #attachChip button:hover { color: var(--danger); }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 8px 8px 14px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #inputBar:focus-within {
    border-color: rgba(124, 92, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
  }

  #messageInput {
    flex: 1;
    resize: none;
    max-height: 160px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    padding: 8px 2px;
  }
  #messageInput::placeholder { color: var(--text-faint); }

  .icon-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.93); }
  .icon-btn.drag-over { background: rgba(124, 92, 255, 0.35); color: var(--text); }

  #sendBtn {
    background: var(--accent-grad);
    color: #0b0620;
  }
  #sendBtn:disabled {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-faint);
    cursor: not-allowed;
  }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); }

  #chatWrap.drag-over::after {
    content: "Drop a PDF to attach";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 4, 13, 0.75);
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    z-index: 5;
    border: 2px dashed var(--accent-1);
    margin: 10px;
    border-radius: 20px;
  }

  /* scrollbar */
  #chatWrap::-webkit-scrollbar { width: 8px; }
  #chatWrap::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div id="stars"></div>
  <div class="nebula a"></div>
  <div class="nebula b"></div>
  <div class="nebula c"></div>

  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>Acme Corp Support Agent</h1>
    </div>
    <div class="status">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </header>

  <div id="chatWrap">
    <div id="chat"></div>
  </div>

  <div id="inputArea">
    <div id="inputInner">
      <div id="attachChip">
        <span id="attachName"></span>
        <button id="attachRemove" type="button" title="Remove attachment">✕</button>
      </div>
      <div id="inputBar">
        <button id="attachBtn" type="button" class="icon-btn" title="Attach a PDF">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="messageInput" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button id="sendBtn" type="button" class="icon-btn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <input type="file" id="fileInput" accept="application/pdf" hidden />
    </div>
  </div>

  <script>
    const API_KEY = "__APP_API_KEY__";

    const chatEl = document.getElementById("chat");
    const chatWrapEl = document.getElementById("chatWrap");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const attachChip = document.getElementById("attachChip");
    const attachName = document.getElementById("attachName");
    const attachRemove = document.getElementById("attachRemove");

    let attachedFilename = null;

    const sessionId = (() => {
      let id = localStorage.getItem("session_id");
      if (!id) {
        id = "web-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem("session_id", id);
      }
      return id;
    })();

    // ---------- starfield ----------
    (function initStars() {
      const canvas = document.createElement("canvas");
      canvas.style.position = "fixed";
      canvas.style.inset = "0";
      canvas.style.zIndex = "-2";
      document.getElementById("stars").appendChild(canvas);
      const ctx = canvas.getContext("2d");
      let stars = [];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function resize() {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        const count = Math.min(160, Math.floor((window.innerWidth * window.innerHeight) / 9000));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: (Math.random() * 1.3 + 0.3) * devicePixelRatio,
          baseAlpha: Math.random() * 0.6 + 0.3,
          phase: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.05 * devicePixelRatio,
        }));
      }

      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const twinkle = reduceMotion ? s.baseAlpha : s.baseAlpha * (0.6 + 0.4 * Math.sin(t / 900 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(230, 225, 255, ${twinkle})`;
          ctx.fill();
          if (!reduceMotion) {
            s.y += s.drift;
            if (s.y > canvas.height) s.y = 0;
            if (s.y < 0) s.y = canvas.height;
          }
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(draw);
    })();

    // ---------- formatting ----------
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatText(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      return out;
    }

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "row " + role;

      if (role !== "system") {
        const avatar = document.createElement("div");
        avatar.className = "avatar " + role;
        avatar.textContent = role === "ai" ? "A" : "U";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = formatText(text);
      row.appendChild(bubble);

      chatEl.appendChild(row);
      chatWrapEl.scrollTop = chatWrapEl.scrollHeight;
      return row;
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          statusDot.className = "status-dot online";
          statusText.textContent = "online";
        } else {
          throw new Error();
        }
      } catch {
        statusDot.className = "status-dot offline";
        statusText.textContent = "unreachable";
      }
    }
    checkHealth();

    // ---------- auto-growing textarea ----------
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ---------- file attach ----------
    function setAttachment(filename) {
      attachedFilename = filename;
      attachName.textContent = filename ? `📎 ${filename}` : "";
      attachChip.classList.toggle("show", !!filename);
    }

    async function uploadFile(file) {
      if (!file) return;
      if (!file.type.includes("pdf") && !file.name.toLowerCase().endsWith(".pdf")) {
        addMessage("system", "Only PDF files are supported.");
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        addMessage("system", "File too large (max 10MB).");
        return;
      }

      attachName.textContent = "Uploading…";
      attachChip.classList.add("show");

      try {
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/upload", {
          method: "POST",
          headers: { "X-API-Key": API_KEY },
          body: form,
        });
        if (!res.ok) {
          const err = await res.text();
          addMessage("system", "Upload failed: " + err);
          setAttachment(null);
          return;
        }
        const data = await res.json();
        setAttachment(data.filename);
      } catch (e) {
        addMessage("system", "Upload failed: " + e.message);
        setAttachment(null);
      }
    }

    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) uploadFile(fileInput.files[0]);
      fileInput.value = "";
    });
    attachRemove.addEventListener("click", () => setAttachment(null));

    ["dragenter", "dragover"].forEach((evt) =>
      chatWrapEl.addEventListener(evt, (e) => {
        e.preventDefault();
        chatWrapEl.classList.add("drag-over");
      })
    );
    ["dragleave", "drop"].forEach((evt) =>
      chatWrapEl.addEventListener(evt, (e) => {
        e.preventDefault();
        chatWrapEl.classList.remove("drag-over");
      })
    );
    chatWrapEl.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      if (file) uploadFile(file);
    });

    // ---------- send ----------
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text && !attachedFilename) return;

      const displayText = attachedFilename ? `📎 ${attachedFilename}\n${text}` : text;
      addMessage("user", displayText || `📎 ${attachedFilename}`);

      const payload = attachedFilename
        ? `[Attached file: ${attachedFilename}]\n${text}`
        : text;

      inputEl.value = "";
      inputEl.style.height = "auto";
      setAttachment(null);
      sendBtn.disabled = true;

      const typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.innerHTML = "<span></span><span></span><span></span>";
      chatEl.appendChild(typingEl);
      chatWrapEl.scrollTop = chatWrapEl.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY,
          },
          body: JSON.stringify({ session_id: sessionId, message: payload }),
        });
        typingEl.remove();

        if (!res.ok) {
          const err = await res.text();
          addMessage("system", "Error: " + err);
          return;
        }
        const data = await res.json();
        addMessage("ai", data.reply);
      } catch (e) {
        typingEl.remove();
        addMessage("system", "Network error: " + e.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    addMessage("system", "Session: " + sessionId);
  </script>
</body>
</html>
