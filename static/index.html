<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhijay's AI</title>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #05040d;
    --bg-1: #0b0620;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-border: rgba(255, 255, 255, 0.09);
    --surface-hover: rgba(255, 255, 255, 0.075);
    --text: #ece9fb;
    --text-dim: #9a92c4;
    --text-faint: #6a638f;
    --accent-1: #7c5cff;
    --accent-2: #22d3ee;
    --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --online: #34e5a8;
    --danger: #ff6b81;
    --radius: 16px;
    --accent-highlight: #f2f0ff;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- animated space background ---------- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-1), var(--bg-0) 60%);
  }

  .nebula {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .nebula.a {
    width: 46vw; height: 46vw;
    background: radial-gradient(circle, var(--accent-1), transparent 70%);
    top: -12vw; left: -10vw;
    animation: drift-a 34s ease-in-out infinite;
  }
  .nebula.b {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    bottom: -14vw; right: -8vw;
    animation: drift-b 40s ease-in-out infinite;
  }
  .nebula.c {
    width: 28vw; height: 28vw;
    background: radial-gradient(circle, #ff5cc4, transparent 70%);
    top: 30%; right: 15%;
    opacity: 0.18;
    animation: drift-c 46s ease-in-out infinite;
  }

  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vw, 8vw) scale(1.15); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vw, -6vw) scale(1.1); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-4vw, 5vw) scale(1.2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula { animation: none !important; }
  }

  /* ---------- icon rail ---------- */
  #iconRail {
    width: 64px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    background: rgba(8, 5, 20, 0.4);
    border-right: 1px solid var(--surface-border);
    z-index: 3;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent-grad);
    box-shadow: 0 0 18px rgba(124, 92, 255, 0.55);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #0b0620;
    margin-bottom: 4px;
  }
  .rail-btn {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .rail-btn:hover { background: var(--surface-hover); color: var(--text); }
  .rail-btn:active { transform: scale(0.94); }
  .rail-btn.primary {
    background: var(--accent-grad);
    color: #0b0620;
  }
  .rail-btn.primary:hover { filter: brightness(1.08); }
  .rail-spacer { flex: 1; }

  /* ---------- top bar (inside main area) ---------- */
  .mainHeader {
    padding: 16px 24px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 2;
  }
  .mainHeaderTitle {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    box-shadow: 0 0 0 rgba(52, 229, 168, 0);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.online {
    background: var(--online);
    box-shadow: 0 0 10px 2px rgba(52, 229, 168, 0.55);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .status-dot.offline {
    background: var(--danger);
    box-shadow: 0 0 10px 2px rgba(255, 107, 129, 0.5);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ---------- app body: rail + drawer + main ---------- */
  #appBody {
    flex: 1;
    display: none; /* shown by JS once auth is confirmed, avoids a flash of the app pre-login */
    min-height: 0;
    overflow: hidden;
  }

  /* ---------- auth screen ---------- */
  #authScreen {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
  }
  .auth-mark {
    width: 44px; height: 44px;
    font-size: 20px;
    margin-bottom: 0;
  }
  .auth-title {
    font-size: 18px;
    font-weight: 800;
    margin: 0;
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 999px;
    padding: 3px;
    width: 100%;
  }
  .auth-tab {
    flex: 1;
    padding: 8px 0;
    border-radius: 999px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .auth-tab.active {
    background: rgba(124, 92, 255, 0.2);
    color: var(--text);
  }
  #authForm {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #authForm input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--surface-border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #authForm input:focus {
    border-color: rgba(124, 92, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
  }
  #authForm input::placeholder { color: var(--text-faint); }
  #authError {
    font-size: 12px;
    color: var(--danger);
    min-height: 14px;
    text-align: center;
  }
  #authSubmit {
    width: 100%;
    padding: 11px 0;
    border-radius: 12px;
    border: none;
    background: var(--accent-grad);
    color: #0b0620;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s;
  }
  #authSubmit:hover:not(:disabled) { filter: brightness(1.08); }
  #authSubmit:disabled { opacity: 0.6; cursor: not-allowed; }

  #sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    height: 100%;
    width: min(82vw, 300px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 10px;
    background: rgba(8, 5, 20, 0.65);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--surface-border);
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 20;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
  }
  #sidebar.open { transform: translateX(0); }

  #newChatBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid rgba(124, 92, 255, 0.4);
    background: rgba(124, 92, 255, 0.12);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #newChatBtn:hover { background: rgba(124, 92, 255, 0.22); }

  #chatList {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 8px 9px 12px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .chat-item:hover { background: var(--surface-hover); }
  .chat-item.active {
    background: rgba(124, 92, 255, 0.15);
    color: var(--text);
  }
  .chat-item-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item-close {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 6px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .chat-item:hover .chat-item-close,
  .chat-item.active .chat-item-close { opacity: 1; }
  .chat-item-close:hover { color: var(--danger); background: rgba(255, 107, 129, 0.12); }

  #sidebar::-webkit-scrollbar, #chatList::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; }

  #memoryPanel {
    border-top: 1px solid var(--surface-border);
    padding-top: 10px;
    margin-top: 4px;
    flex-shrink: 0;
  }
  #memoryToggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px;
    border-radius: 9px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  #memoryToggle:hover { background: var(--surface-hover); color: var(--text); }
  #memoryCount {
    font-size: 11px;
    color: var(--text-faint);
    background: rgba(124, 92, 255, 0.15);
    border-radius: 999px;
    padding: 1px 7px;
  }
  #memoryList {
    display: none;
    flex-direction: column;
    gap: 3px;
    margin-top: 4px;
  }
  #memoryList.open { display: flex; }
  .memory-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .memory-item:hover { background: var(--surface-hover); }
  .memory-item-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .memory-item-text b { color: var(--text); font-weight: 600; }
  .memory-item-del {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 6px;
    opacity: 0;
    flex-shrink: 0;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .memory-item:hover .memory-item-del { opacity: 1; }
  .memory-item-del:hover { color: var(--danger); background: rgba(255, 107, 129, 0.12); }
  .memory-empty {
    font-size: 12px;
    color: var(--text-faint);
    padding: 6px 8px;
  }

  #mainArea {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- chat area ---------- */
  #chatWrap {
    flex: 1;
    overflow-y: auto;
    z-index: 1;
  }
  #chat {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 100%;
  }

  .row {
    display: flex;
    gap: 10px;
    max-width: 100%;
    animation: rise 0.35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.user { flex-direction: row-reverse; align-self: flex-end; }
  .row.ai { align-self: flex-start; }
  .row.system { align-self: center; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
  }
  .avatar.ai {
    background: var(--accent-grad);
    color: #0b0620;
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.14);
  }
  .avatar.user {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    border: 1px solid var(--surface-border);
  }

  .bubble {
    max-width: 70ch;
    padding: 12px 15px;
    border-radius: var(--radius);
    line-height: 1.55;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .row.user .bubble {
    background: var(--accent-grad);
    color: #0b0620;
    font-weight: 500;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .row.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom-left-radius: 4px;
    box-shadow: 0 8px 24px -16px rgba(0, 0, 0, 0.6);
  }
  .row.system .bubble {
    background: transparent;
    color: var(--text-faint);
    font-size: 12px;
    padding: 4px 10px;
    white-space: pre-wrap;
  }

  /* ---------- persistent tool-use transparency (not just the transient
     "Searching the web…" status text — a lasting record of what actually
     ran, visible even after the reply is done streaming) ---------- */
  .ai-content-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tools-used { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .tool-chip-spinner {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--text-faint);
    border-top-color: var(--accent-2);
    animation: chip-spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes chip-spin { to { transform: rotate(360deg); } }
  .tool-chip.ok { border-color: rgba(52, 229, 168, 0.3); }
  .tool-chip.ok .tool-chip-mark { color: var(--online); }
  .tool-chip.error { border-color: rgba(255, 107, 129, 0.35); }
  .tool-chip.error .tool-chip-mark { color: var(--danger); }
  @media (prefers-reduced-motion: reduce) {
    .tool-chip-spinner { animation: none; }
  }

  /* ---------- markdown rendering inside AI bubbles ---------- */
  .bubble > *:first-child { margin-top: 0; }
  .bubble > *:last-child { margin-bottom: 0; }
  .bubble p { margin: 8px 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 14px 0 6px;
    font-weight: 700;
    line-height: 1.3;
  }
  .bubble h1 { font-size: 1.25em; }
  .bubble h2 { font-size: 1.15em; }
  .bubble h3 { font-size: 1.05em; }
  .bubble h4 { font-size: 1em; }
  .bubble ul, .bubble ol {
    margin: 8px 0;
    padding-left: 22px;
  }
  .bubble li { margin: 3px 0; }
  .bubble blockquote {
    margin: 8px 0;
    padding: 4px 12px;
    border-left: 3px solid var(--accent-1);
    color: var(--text-dim);
  }
  .bubble hr {
    border: none;
    border-top: 1px solid var(--surface-border);
    margin: 12px 0;
  }
  .bubble code {
    background: rgba(0, 0, 0, 0.35);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: 0.9em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .bubble a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.4); }

  /* ---------- citations shown when an answer used web search ---------- */
  .sources-row {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--surface-border);
    font-size: 12px;
    line-height: 1.6;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .sources-row .sources-label { color: var(--text-faint); }
  .sources-row a {
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px dashed var(--text-faint);
  }
  .sources-row a:hover { color: var(--text); border-bottom-color: var(--text-dim); }
  .sources-row .source-doc { color: var(--text-dim); }

  .table-wrap { overflow-x: auto; margin: 8px 0; }
  .bubble table {
    border-collapse: collapse;
    font-size: 0.92em;
    width: 100%;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--surface-border);
    padding: 6px 10px;
    text-align: left;
  }
  .bubble th { background: rgba(255, 255, 255, 0.05); font-weight: 600; }

  .code-block {
    margin: 10px 0;
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.3);
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid var(--surface-border);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .copy-btn {
    background: rgba(255, 255, 255, 0.06);
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }
  .copy-btn:hover { background: var(--surface-hover); color: var(--text); }
  .code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .code-block code {
    background: none;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre;
  }

  /* ---------- status / tool-activity bubble ---------- */
  .status-bubble {
    color: var(--text-dim);
    font-size: 13.5px;
    display: flex;
    align-items: center;
    min-height: 20px;
  }
  .tool-status { animation: fade-pulse 1.6s ease-in-out infinite; }
  @keyframes fade-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .typing-dots { display: inline-flex; gap: 4px; }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- input bar ---------- */
  #inputArea {
    z-index: 2;
    padding: 14px 24px 20px;
    background: linear-gradient(0deg, rgba(5,4,13,0.9) 40%, transparent);
    flex-shrink: 0;
  }
  #inputInner {
    max-width: 780px;
    margin: 0 auto;
  }

  #attachChip {
    display: none;
    align-items: center;
    gap: 8px;
    width: fit-content;
    margin: 0 0 8px 4px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  #attachChip.show { display: flex; }
  #attachChip button {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  #attachChip button:hover { color: var(--danger); }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 8px 8px 14px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 22px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #inputBar:focus-within {
    border-color: rgba(124, 92, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
  }

  #messageInput {
    flex: 1;
    resize: none;
    max-height: 160px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    padding: 8px 2px;
  }
  #messageInput::placeholder { color: var(--text-faint); }

  .icon-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.93); }
  .icon-btn.drag-over { background: rgba(124, 92, 255, 0.35); color: var(--text); }

  #sendBtn {
    background: var(--accent-grad);
    color: #0b0620;
  }
  #sendBtn:disabled {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-faint);
    cursor: not-allowed;
  }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); }

  #chatWrap.drag-over::after {
    content: "Drop a PDF to attach";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 4, 13, 0.75);
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    z-index: 5;
    border: 2px dashed var(--accent-1);
    margin: 10px;
    border-radius: 20px;
  }

  /* scrollbar */
  #chatWrap::-webkit-scrollbar { width: 8px; }
  #chatWrap::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 8px;
  }

  #sidebarBackdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(3, 2, 8, 0.6);
    z-index: 15;
  }
  #sidebarBackdrop.show { display: block; }

  /* ---------- keyboard focus ---------- */
  button:focus-visible {
    outline: 2px solid rgba(124, 92, 255, 0.65);
    outline-offset: 2px;
  }

  /* ============================================================
     LANDING EXPERIENCE — built by renderWelcomeScreen() into
     #welcomeScreen only, so it never touches active-chat markup.
     Escapes #chat's 780px reading-width constraint to go
     full-bleed while still scrolling inside #chatWrap.
     ============================================================ */
  body.landing-active .mainHeader { display: none; }
  /* The real icon rail (new chat/history/memory/logout) is genuine
     chat-session chrome — right once you're actually chatting, but the
     landing screen gets its own, richer sidebar instead (nav + status
     widgets), so the plain icon rail is redundant here. #mainArea is a
     flex:1 sibling so hiding it reclaims the width automatically. */
  body.landing-active #iconRail { display: none; }

  #welcomeScreen {
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    display: block;
    padding: 0;
    text-align: initial;
    animation: none;
  }

  /* ---------- shell: sidebar + main column ---------- */
  .landing-shell { display: flex; align-items: flex-start; }
  .landing-main { flex: 1; min-width: 0; }

  /* ---------- sidebar (persistent, desktop/tablet) ---------- */
  .landing-sidebar {
    width: 240px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 20px 14px;
    background: rgba(10, 8, 24, 0.5);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--surface-border);
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 6px; }
  .sidebar-brand-text { font-size: 14px; font-weight: 800; white-space: nowrap; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar-nav-item svg { flex-shrink: 0; opacity: 0.85; }
  .sidebar-nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .sidebar-nav-item.active { background: rgba(124, 92, 255, 0.16); color: var(--text); box-shadow: inset 2px 0 0 var(--accent-2); }
  .sidebar-widgets { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--surface-border); }
  .sidebar-widget { padding: 12px 13px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--surface); }
  .sidebar-widget-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-faint); margin: 0 0 8px; }
  .sidebar-widget-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-dim); padding: 3px 0; }
  .sidebar-widget-row .ok { color: var(--online); font-weight: 700; }
  .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--surface-border); display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sidebar-footer-email { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  @media (max-width: 1080px) {
    .landing-sidebar { width: 74px; padding: 20px 8px; }
    .landing-sidebar .sidebar-nav-item { justify-content: center; padding: 12px; }
    .landing-sidebar .sidebar-label,
    .landing-sidebar .sidebar-brand-text,
    .landing-sidebar .sidebar-widgets,
    .landing-sidebar .sidebar-footer-email { display: none; }
  }
  @media (max-width: 768px) {
    .landing-sidebar { display: none; }
  }

  /* ---------- mobile drawer (mirrors sidebar content, overlay) ---------- */
  .landing-drawer-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(3, 2, 8, 0.6);
    z-index: 24;
  }
  .landing-drawer-backdrop.show { display: block; }
  .landing-drawer {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(82vw, 290px);
    height: 100%;
    background: rgba(8, 5, 20, 0.94);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-right: 1px solid var(--surface-border);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 25;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }
  .landing-drawer.open { transform: translateX(0); }
  .landing-drawer .sidebar-nav-item { font-size: 14.5px; padding: 11px 12px; }
  .drawer-section-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-faint); margin: 4px 0 -6px 12px; }
  .landing-drawer .landing-cta { align-self: flex-start; }

  /* ---------- top nav (sits inside .landing-main) ---------- */
  .landing-nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 28px;
    border-bottom: 1px solid transparent;
    transition: background 0.25s, border-color 0.25s;
  }
  .landing-nav.scrolled {
    background: rgba(8, 5, 20, 0.72);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-bottom-color: var(--surface-border);
  }
  .landing-nav-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .landing-nav-brand { font-size: 14px; font-weight: 800; letter-spacing: 0.2px; white-space: nowrap; }
  .landing-nav-links { display: flex; align-items: center; gap: 2px; list-style: none; margin: 0; padding: 0; }
  .landing-nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }
  .landing-nav-links a:hover, .landing-nav-links a:focus-visible { color: var(--text); background: var(--surface-hover); }
  .landing-nav-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .landing-status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-dim); text-transform: uppercase; white-space: nowrap; }
  .landing-cta {
    padding: 9px 18px;
    border-radius: 999px;
    border: none;
    background: var(--accent-grad);
    color: #0b0620;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(124, 92, 255, 0.3);
    transition: filter 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .landing-cta:hover { filter: brightness(1.08); }
  .landing-cta:active { transform: scale(0.97); }

  /* mobile: brand + a single hamburger opening the drawer above */
  .landing-nav-toggle {
    display: none;
    width: 36px; height: 36px;
    border-radius: 9px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--text);
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  @media (max-width: 860px) {
    .landing-nav-links { display: none; }
    .landing-nav-right .landing-status,
    .landing-nav-right .landing-cta { display: none; }
    .landing-nav-toggle { display: flex; }
  }

  /* ---------- hero: two columns on desktop (text | AI core+widgets) ---------- */
  .landing-hero {
    position: relative;
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 56px 40px 40px;
  }
  .hero-content { position: relative; z-index: 2; flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    width: fit-content;
  }
  .hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--online); box-shadow: 0 0 8px 2px rgba(52,229,168,0.6); }
  .hero-title {
    font-size: clamp(32px, 4.6vw, 54px);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -1px;
    margin: 0;
  }
  .hero-title .grad {
    background: linear-gradient(135deg, var(--accent-highlight) 0%, var(--accent-2) 55%, var(--accent-1) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero-sub {
    font-size: clamp(14px, 1.4vw, 16px);
    color: var(--text-dim);
    max-width: 480px;
    line-height: 1.6;
    margin: 0;
  }
  .hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .hero-btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 26px;
    border-radius: 999px;
    border: none;
    background: var(--accent-grad);
    color: #0b0620;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(124, 92, 255, 0.35);
    transition: filter 0.15s, transform 0.1s;
  }
  .hero-btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .hero-btn-secondary {
    padding: 12px 26px;
    border-radius: 999px;
    border: 1px solid rgba(124, 92, 255, 0.35);
    background: rgba(124, 92, 255, 0.06);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .hero-btn-secondary:hover { background: rgba(124, 92, 255, 0.12); border-color: rgba(124, 92, 255, 0.6); transform: translateY(-1px); }

  .hero-prompts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .hero-prompt-chip {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .hero-prompt-chip:hover { background: var(--surface-hover); color: var(--text); border-color: rgba(124, 92, 255, 0.4); }

  /* ---------- AI core stage + floating widget panels ---------- */
  /* The core+widgets column is a sibling of hero-content, not an absolute
     backdrop behind it — on desktop flexbox places them side by side, on
     mobile they stack below. Either way the core can never visually sit
     under the headline/buttons, by construction rather than z-index. */
  .hero-visual { position: relative; flex: 1 1 420px; min-width: 280px; display: flex; align-items: center; justify-content: center; }
  .hero-core-stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 40vh;
    min-height: 280px;
    max-height: 420px;
  }
  .hero-canvas-wrap { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .hero-canvas-wrap canvas { width: 100%; height: 100%; display: block; }
  .hero-glow-fallback {
    position: absolute;
    top: 50%; left: 50%;
    width: min(65%, 300px); height: min(65%, 300px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,255,0.32), rgba(34,211,238,0.12) 55%, transparent 75%);
    filter: blur(18px);
    z-index: 0;
    animation: core-breathe 5s ease-in-out infinite;
  }
  @keyframes core-breathe {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  }

  .hud-panel {
    position: absolute;
    z-index: 1;
    width: 170px;
    padding: 11px 13px;
    border-radius: 12px;
    border: 1px solid var(--surface-border);
    background: rgba(10, 8, 24, 0.45);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    font-size: 10.5px;
    font-family: inherit;
    text-align: left;
    color: var(--text-dim);
    pointer-events: none;
    opacity: 0;
    animation: hud-in 0.8s ease forwards;
    transition: border-color 0.15s;
  }
  .hud-quote { margin-top: 6px; color: var(--text-dim); font-style: italic; }
  .hud-panel .hud-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 7px;
  }
  .hud-panel .hud-title .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 6px 1px var(--accent-2); }
  .hud-panel .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .hud-panel .hud-row .ok { color: var(--online); font-weight: 700; }
  .hud-panel.hud-1 { top: 0%; left: -4%; animation-delay: 0.2s; }
  .hud-panel.hud-2 { top: 4%; right: -6%; animation-delay: 0.5s; }
  .hud-panel.hud-3 { bottom: 2%; right: 2%; animation-delay: 0.8s; pointer-events: auto; cursor: pointer; }
  .hud-panel.hud-3:hover { border-color: rgba(124,92,255,0.4); }
  @keyframes hud-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 1150px) {
    .hud-panel.hud-1, .hud-panel.hud-2 { display: none; }
  }

  @media (max-width: 900px) {
    /* align-items:center (set for the row layout, to vertically center
       text against the core) means something different once flex-direction
       flips to column — there it centers items at their own intrinsic
       width instead of stretching them, which collapsed .hero-visual to a
       sliver. Reset to stretch so both columns take the full width. */
    .landing-hero { flex-direction: column; align-items: stretch; padding: 40px 20px 20px; gap: 20px; }
    .hero-content { text-align: center; align-items: center; }
    .hero-sub { max-width: 480px; }
    .hero-actions, .hero-prompts { justify-content: center; }
    .hero-visual { min-width: 0; width: 100%; }
    .hero-core-stage { height: 30vh; min-height: 220px; max-width: 340px; margin: 0 auto; }
    .hud-panel.hud-3 { position: static; margin-top: 10px; width: 100%; max-width: 300px; opacity: 1; animation: none; }
  }

  /* ---------- section shell ---------- */
  .landing-section { max-width: 1100px; margin: 0 auto; padding: 90px 24px; position: relative; z-index: 1; }
  .section-eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent-2); margin: 0 0 10px;
  }
  .section-title { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; margin: 0 0 12px; letter-spacing: -0.5px; }
  .section-desc { font-size: 14px; color: var(--text-dim); max-width: 560px; line-height: 1.6; margin: 0 0 40px; }

  /* ---------- capability cards ---------- */
  .cap-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .cap-card {
    position: relative;
    padding: 26px 24px;
    border-radius: 16px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
  }
  .cap-card::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 2px;
    background: var(--accent-grad);
    opacity: 0.7;
  }
  .cap-card:hover { transform: translateY(-3px); border-color: rgba(124,92,255,0.35); background: var(--surface-hover); }
  .cap-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(124, 92, 255, 0.14);
    color: var(--accent-2);
    margin-bottom: 14px;
  }
  .cap-num { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 10px; }
  .cap-title { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
  .cap-desc { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin: 0 0 16px; }
  .cap-action {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .cap-action:hover { background: rgba(124, 92, 255, 0.14); border-color: rgba(124, 92, 255, 0.4); }
  @media (max-width: 700px) { .cap-grid { grid-template-columns: 1fr; } }

  /* ---------- pipeline ---------- */
  .pipeline { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .pipe-step {
    flex: 1;
    min-width: 90px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center;
  }
  .pipe-node {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    color: var(--text-dim);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
  }
  .pipe-step:hover .pipe-node {
    border-color: var(--accent-2);
    color: var(--text);
    box-shadow: 0 0 16px rgba(124, 92, 255, 0.35);
  }
  .pipe-label { font-size: 11.5px; font-weight: 600; color: var(--text-dim); }
  .pipe-connector {
    flex: 0.6;
    height: 1px;
    min-width: 20px;
    margin-top: 27px;
    background: linear-gradient(90deg, var(--surface-border), var(--accent-2), var(--surface-border));
    background-size: 200% 100%;
    animation: pipe-flow 3s linear infinite;
  }
  @keyframes pipe-flow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (max-width: 760px) {
    .pipeline { flex-direction: column; align-items: center; }
    .pipe-connector { width: 1px; height: 20px; min-width: 1px; margin-top: 0; background: linear-gradient(180deg, var(--surface-border), var(--accent-2), var(--surface-border)); background-size: 100% 200%; animation: pipe-flow-v 3s linear infinite; }
  }
  @keyframes pipe-flow-v { 0% { background-position: 0 200%; } 100% { background-position: 0 -200%; } }

  /* ---------- tech stack ---------- */
  .tech-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .tech-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .tech-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }

  /* ---------- footer ---------- */
  .landing-footer {
    max-width: 1100px; margin: 0 auto;
    padding: 30px 24px 70px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--surface-border);
    font-size: 12px; color: var(--text-faint);
  }
  .landing-footer a { color: var(--text-dim); text-decoration: none; }
  .landing-footer a:hover { color: var(--text); }

  /* ---------- scroll reveal ---------- */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ---------- futuristic command bar (enhances the existing, always-visible #inputBar) ---------- */
  #inputBar { position: relative; }
  #inputBar::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 23px;
    padding: 1px;
    background: linear-gradient(120deg, rgba(124,92,255,0.5), rgba(34,211,238,0.5), rgba(124,92,255,0.5));
    background-size: 200% 200%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.3;
    animation: bar-glow-flow 6s linear infinite;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #inputBar:focus-within::before { opacity: 0.9; }
  @keyframes bar-glow-flow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; opacity: 1; transform: none; }
    .hero-glow-fallback { animation: none; }
    .pipe-connector { animation: none; }
    #inputBar::before { animation: none; }
  }

  @media (max-width: 560px) {
    .landing-hero { padding: 96px 18px 12px; }
    .landing-section { padding: 60px 18px; }
  }
</style>

    let userEmail = null; // real account email, shown in the landing sidebar footer

    function authHeaders(extra) {
      return Object.assign({ Authorization: `Bearer ${authToken}` }, extra || {});

    const chatEl = document.getElementById("chat");

    const sidebarBackdrop = document.getElementById("sidebarBackdrop");

    const railMemoryToggle = document.getElementById("railMemoryToggle");

    // ---------- sidebar drawer open/close (rail-triggered, all sizes) ----------
    function openSidebar() {

      openSidebar();
      document.getElementById("memoryList").classList.add("open");
      loadMemories();
    });
    sidebarBackdrop.addEventListener("click", closeSidebar);

    let attachedFilename = null;

    const TOOL_LABELS = {
      calculator: "🧮 Calculating…",
      get_weather: "🌦️ Checking the weather…",
      run_sql_query: "📦 Checking inventory…",
      web_search: "🔍 Searching the web…",
      read_pdf: "📄 Reading the PDF…",
      browse_webpage: "🌐 Reading a source in detail…",
      check_order_status: "📦 Looking up your order…",
      create_support_ticket: "🎫 Filing your ticket…",
      remember_about_me: "🧠 Remembering that…",
      forget_about_me: "🧠 Updating my memory…",
    };

    // ---------- session (multi-chat) management ----------
    const SESSIONS_KEY = "chat_sessions";
    const ACTIVE_KEY = "active_session_id";

    function newSessionId() {
      return "web-" + Math.random().toString(36).slice(2, 10);
    }

    // ---------- "what I know about you" memory panel ----------
    const memoryToggle = document.getElementById("memoryToggle");
    const memoryListEl = document.getElementById("memoryList");
    const memoryCountEl = document.getElementById("memoryCount");
    let memoryPanelOpen = false;

    async function loadMemories() {
      try {
        const res = await fetch("/memories", { headers: authHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        renderMemories(data.memories || []);
      } catch {
        // silent — the panel just won't update this round
      }
    }

    function renderMemories(memories) {
      memoryCountEl.textContent = memories.length ? String(memories.length) : "";
      memoryListEl.innerHTML = "";

      if (memories.length === 0) {
        const empty = document.createElement("div");
        empty.className = "memory-empty";
        empty.textContent = "Nothing remembered yet.";
        memoryListEl.appendChild(empty);
        return;
      }

      for (const m of memories) {
        const item = document.createElement("div");
        item.className = "memory-item";

        const text = document.createElement("span");
        text.className = "memory-item-text";
        text.innerHTML = `<b>${escapeHtml(m.key)}</b>: ${escapeHtml(m.value)}`;

        const del = document.createElement("button");
        del.className = "memory-item-del";
        del.type = "button";
        del.title = "Forget this";
        del.textContent = "✕";
        del.addEventListener("click", async () => {
          del.disabled = true;
          try {
            await fetch(`/memories/${encodeURIComponent(m.key)}`, {
              method: "DELETE",
              headers: authHeaders(),
            });
            loadMemories();
          } catch {
            del.disabled = false;
          }
        });

        item.appendChild(text);
        item.appendChild(del);
        memoryListEl.appendChild(item);
      }
    }

    memoryToggle.addEventListener("click", () => {
      memoryPanelOpen = !memoryPanelOpen;
      memoryListEl.classList.toggle("open", memoryPanelOpen);
      if (memoryPanelOpen) loadMemories();
    });

    // Sessions (chat tabs) are stored per-account, so switching accounts on
    // the same browser never shows a different person's tab list.
    function sessionsStorageKey() { return `${SESSIONS_KEY}:${userId}`; }
    function activeStorageKey() { return `${ACTIVE_KEY}:${userId}`; }

    function loadSessions() {
      try {
        const raw = localStorage.getItem(sessionsStorageKey());
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch {}
      return [];
    }

    function saveSessions() {
      localStorage.setItem(sessionsStorageKey(), JSON.stringify(sessions));
    }

    let sessions = [];
    let activeId = null;

    function initSessions() {
      sessions = loadSessions();
      if (sessions.length === 0) {
        sessions = [{ id: newSessionId(), title: "New chat" }];
      }
      activeId = localStorage.getItem(activeStorageKey());
      if (!activeId || !sessions.some((s) => s.id === activeId)) {
        activeId = sessions[0].id;
      }
      saveSessions();
      localStorage.setItem(activeStorageKey(), activeId);
    }

    function renderChatList() {
      chatListEl.innerHTML = "";
      for (const s of sessions) {
        const item = document.createElement("div");
        item.className = "chat-item" + (s.id === activeId ? " active" : "");

        const label = document.createElement("span");
        label.className = "chat-item-label";
        label.textContent = s.title;
        item.addEventListener("click", () => switchSession(s.id));

        const close = document.createElement("button");
        close.type = "button";
        close.className = "chat-item-close";
        close.textContent = "✕";
        close.title = "Delete this chat";
        close.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteSession(s.id);
        });

        item.appendChild(label);
        item.appendChild(close);
        chatListEl.appendChild(item);
      }

    // ============================================================
    // Landing / hero experience — everything below builds the

    // ============================================================

    const WELCOME_PROMPTS = [

      chart: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
      doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
      gear: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',

      arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',

    // Every item routes into the real chat (with a relevant starter prompt)

    const SIDEBAR_ITEMS = [

      { label: "AI Chat", icon: ICONS.chat, action: () => focusComposer() },

      { label: "Data Analyzer", icon: ICONS.chart, action: () => startChatWithPrompt("Help me analyze some data — I'll describe or paste it in.") },
      { label: "Knowledge / RAG", icon: ICONS.doc, action: () => attachBtn.click() },
      { label: "Settings", icon: ICONS.gear, action: () => railMemoryToggle.click() },
    ];

    const CAPABILITIES = [
      {
        num: "01", icon: "code", title: "Smart Code Assistant",
        desc: "Write, debug and optimize code with AI.",
        actionLabel: "Open Code Assistant",
        prompt: "Help me write, debug, or understand some code.",

        prompt: "Help me analyze some data — I'll describe or paste it in.",

      {

    const PIPELINE_STEPS = ["User", "Understand", "Retrieve", "Reason", "Generate", "Answer"];

    const TECH_STACK = ["Groq · Llama 3.3 70B", "ChromaDB (RAG)", "Redis", "FastAPI", "Tavily Search", "Playwright"];

    // ---------- 3D AI-core hero scene (Three.js, lazy-loaded) ----------
    // Loaded from a CDN on demand (no bundler/build step in this project) —
    // only fetched the first time a welcome screen actually renders, and
    // never blocks first paint: the CSS glow behind the canvas is already a
    // complete-looking hero on its own, so this only progressively
    // enhances it once it's ready.
    async function loadThree() {
      if (!window.__threeModulePromise) {
        window.__threeModulePromise = import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
      }
      return window.__threeModulePromise;
    }

    let activeHeroScene = null;
    function destroyHeroScene() {
      if (activeHeroScene) {
        activeHeroScene.cleanup();
        activeHeroScene = null;
      }
    }

    async function initHeroScene(canvas) {
      let THREE;
      try {
        THREE = await loadThree();
      } catch {
        return; // offline/CDN blocked — the CSS glow fallback still looks complete on its own
      }
      if (!canvas.isConnected) return; // welcome screen was already dismissed while this was loading

      destroyHeroScene();

      try {
        const container = canvas.parentElement;
        const isSmall = window.innerWidth < 768;
        // Deliberately sparse and simple: a single glowing core, a soft
        // halo behind it for cheap glow (no bloom post-processing pipeline
        // needed), 3 thin rings, and a light scatter of particles. No
        // wireframe shell, no faceted "network" geometry — that busyness
        // was the whole complaint with the previous version.
        const particleCount = isSmall ? 45 : 120;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 0, 3.4);

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 2));
        renderer.setClearColor(0x000000, 0);

        const violet = new THREE.Color(0x7c5cff);
        const cyan = new THREE.Color(0x22d3ee);
        const highlight = new THREE.Color(0xf2f0ff);
        const coreGroup = new THREE.Group();

        const coreGeo = new THREE.SphereGeometry(0.44, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: highlight, transparent: true, opacity: 0.95 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(core);

        // A larger, additive-blended, mostly-transparent sphere directly
        // behind the core reads as a soft glow without any post-processing.
        const haloGeo = new THREE.SphereGeometry(0.7, 24, 24);
        const haloMat = new THREE.MeshBasicMaterial({
          color: cyan, transparent: true, opacity: 0.22,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        coreGroup.add(halo);

        const ringSpecs = [
          { radius: 1.0, tube: 0.006, color: cyan, rx: 1.15, ry: 0.15, speed: 0.09 },
          { radius: 1.24, tube: 0.005, color: violet, rx: -0.5, ry: 1.0, speed: -0.065 },
          { radius: 1.48, tube: 0.004, color: cyan, rx: 0.35, ry: -0.8, speed: 0.05 },
        ];
        const rings = ringSpecs.map((spec) => {
          const geo = new THREE.TorusGeometry(spec.radius, spec.tube, 8, 96);
          const mat = new THREE.MeshBasicMaterial({ color: spec.color, transparent: true, opacity: 0.55 });
          const ring = new THREE.Mesh(geo, mat);
          ring.rotation.x = spec.rx;
          ring.rotation.y = spec.ry;
          ring.userData.speed = spec.speed;
          coreGroup.add(ring);
          return ring;
        });

        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          const r = 1.0 + Math.random() * 0.85;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);
        }
        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
          color: 0xcfe8ff, size: 0.016, transparent: true, opacity: 0.6,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        coreGroup.add(particles);

        scene.add(coreGroup);

        function resize() {
          const w = container.clientWidth;
          const h = container.clientHeight;
          if (!w || !h) return;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h, false);
        }
        resize();
        const resizeObserver = new ResizeObserver(resize);
        resizeObserver.observe(container);

        let targetX = 0, targetY = 0;
        function onPointerMove(e) {
          targetX = (e.clientX / window.innerWidth - 0.5) * 2;
          targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        }
        if (!reducedMotionMQ.matches) window.addEventListener("pointermove", onPointerMove, { passive: true });

        // Only animate while the hero is actually visible and the tab is
        // active — a background/scrolled-away scene burning CPU serves no
        // one.
        let running = true;
        const io = new IntersectionObserver((entries) => { running = entries[0]?.isIntersecting !== false; }, { threshold: 0.01 });
        io.observe(container);
        function onVisibility() { running = !document.hidden; }
        document.addEventListener("visibilitychange", onVisibility);

        let rafId = null;
        const clock = new THREE.Clock();
        let elapsed = 0;
        let ambientAngle = 0;

        function cleanup() {
          if (rafId) cancelAnimationFrame(rafId);
          resizeObserver.disconnect();
          io.disconnect();
          document.removeEventListener("visibilitychange", onVisibility);
          window.removeEventListener("pointermove", onPointerMove);
          coreGeo.dispose(); coreMat.dispose();
          haloGeo.dispose(); haloMat.dispose();
          rings.forEach((r) => { r.geometry.dispose(); r.material.dispose(); });
          particleGeo.dispose(); particleMat.dispose();
          renderer.dispose();
        }

        function animate() {
          // Self-terminating: once #welcomeScreen is removed (chat started,
          // or a new empty session replaced this one), the canvas is no
          // longer in the DOM — stop and free the WebGL context instead of
          // silently accumulating one per visit (browsers cap concurrent
          // contexts).
          if (!canvas.isConnected) {
            cleanup();
            if (activeHeroScene && activeHeroScene.cleanup === cleanup) activeHeroScene = null;
            return;
          }
          rafId = requestAnimationFrame(animate);
          if (!running) return;

          const dt = clock.getDelta();
          elapsed += dt;
          ambientAngle += dt * 0.05; // slow, constant — alive even without mouse input

          // gentle breathing pulse, not a chaotic throb
          const pulse = 1 + Math.sin(elapsed * 0.85) * 0.05;
          core.scale.setScalar(pulse);
          halo.scale.setScalar(pulse * 1.04);

          rings.forEach((r) => { r.rotation.z += r.userData.speed * 0.01; });
          particles.rotation.y += dt * 0.02;

          const targetGroupY = ambientAngle + (reducedMotionMQ.matches ? 0 : targetX * 0.18);
          const targetGroupX = reducedMotionMQ.matches ? 0 : -targetY * 0.1;
          coreGroup.rotation.y += (targetGroupY - coreGroup.rotation.y) * 0.04;
          coreGroup.rotation.x += (targetGroupX - coreGroup.rotation.x) * 0.04;

          renderer.render(scene, camera);
        }

        activeHeroScene = { cleanup };
        if (reducedMotionMQ.matches) {
          renderer.render(scene, camera); // one static frame — no continuous motion
        } else {
          animate();
        }
      } catch (e) {
        // WebGL unavailable, context creation failed, etc. — fail silently,
        // the CSS glow behind the canvas already reads as a complete hero.
        console.warn("Hero 3D scene unavailable:", e);
      }
    }

    // Tracks the currently-attached scroll listener / reveal observer so a

    // up duplicate listeners on the persistent #chatWrap element.
    let activeLandingCleanup = null;
    function destroyLandingScreen() {
      destroyHeroScene();
      if (activeLandingCleanup) {
        activeLandingCleanup();
        activeLandingCleanup = null;
      }
      document.body.classList.remove("landing-active");

    function setupLandingScrollEffects(wrap) {
      const nav = wrap.querySelector(".landing-nav");
      const drawer = wrap.querySelector(".landing-drawer");
      const drawerBackdrop = wrap.querySelector(".landing-drawer-backdrop");
      function onScroll() {
        nav.classList.toggle("scrolled", chatWrapEl.scrollTop > 20);
        drawer?.classList.remove("open");
        drawerBackdrop?.classList.remove("show");
      }
      chatWrapEl.addEventListener("scroll", onScroll, { passive: true });
      onScroll();

      let observer = null;
      const revealEls = wrap.querySelectorAll(".reveal");
      if (reducedMotionMQ.matches) {
        revealEls.forEach((el) => el.classList.add("visible"));
      } else {
        observer = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            }
          },
          { root: chatWrapEl, threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
        );
        revealEls.forEach((el) => observer.observe(el));
      }

      activeLandingCleanup = () => {
        chatWrapEl.removeEventListener("scroll", onScroll);
        if (observer) observer.disconnect();
      };
    }

    // ---------- starfield ----------
    (function initStars() {
      const canvas = document.createElement("canvas");
      canvas.style.position = "fixed";
      canvas.style.inset = "0";
      canvas.style.zIndex = "-2";
      document.getElementById("stars").appendChild(canvas);
      const ctx = canvas.getContext("2d");
      let stars = [];
      let comets = [];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function resize() {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        const count = Math.min(160, Math.floor((window.innerWidth * window.innerHeight) / 9000));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: (Math.random() * 1.3 + 0.3) * devicePixelRatio,
          baseAlpha: Math.random() * 0.6 + 0.3,
          phase: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.05 * devicePixelRatio,
        }));
      }

      function maybeSpawnComet() {
        if (reduceMotion || comets.length >= 2) return;
        if (Math.random() < 0.004) {
          comets.push({
            x: Math.random() * canvas.width * 0.7 + canvas.width * 0.15,
            y: -30 * devicePixelRatio,
            vx: (Math.random() - 0.5) * 3 * devicePixelRatio,
            vy: (4 + Math.random() * 3) * devicePixelRatio,
            len: (90 + Math.random() * 70) * devicePixelRatio,
            life: 1,
          });
        }
      }

      function drawComets() {
        for (let i = comets.length - 1; i >= 0; i--) {
          const c = comets[i];
          c.x += c.vx;
          c.y += c.vy;
          c.life -= 0.012;
          if (c.life <= 0 || c.y - c.len > canvas.height) {
            comets.splice(i, 1);
            continue;
          }
          const angle = Math.atan2(c.vy, c.vx);
          const tailX = c.x - Math.cos(angle) * c.len;
          const tailY = c.y - Math.sin(angle) * c.len;
          const grad = ctx.createLinearGradient(c.x, c.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255, 255, 255, ${c.life})`);
          grad.addColorStop(0.4, `rgba(180, 170, 255, ${c.life * 0.5})`);
          grad.addColorStop(1, "rgba(124, 92, 255, 0)");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2 * devicePixelRatio;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();
        }
      }

      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const twinkle = reduceMotion ? s.baseAlpha : s.baseAlpha * (0.6 + 0.4 * Math.sin(t / 900 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(230, 225, 255, ${twinkle})`;
          ctx.fill();
          if (!reduceMotion) {
            s.y += s.drift;
            if (s.y > canvas.height) s.y = 0;
            if (s.y < 0) s.y = canvas.height;
          }
        }
        maybeSpawnComet();
        drawComets();
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(draw);
    })();

    // ---------- markdown rendering ----------
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Built with DOM APIs (not innerHTML string concat) so a malicious
    // search-result title/url can never inject markup — .textContent and
    // the .href property are always treated as plain data, never parsed.
    function appendSources(bubble, sources) {
      const row = document.createElement("div");
      row.className = "sources-row";

      const label = document.createElement("span");
      label.className = "sources-label";
      label.textContent = "Sources:";
      row.appendChild(label);

      sources.forEach((s) => {
        // Web sources have a real url and render as a link; RAG/document
        // sources are just a filename (nothing to link to) and render as
        // plain text instead — an <a href="undefined"> would be a broken,
        // clickable-looking dead link.
        if (s.url) {
          const link = document.createElement("a");
          link.href = s.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = s.title || s.url;
          row.appendChild(link);
        } else {
          const span = document.createElement("span");
          span.className = "source-doc";
          span.textContent = s.title;
          row.appendChild(span);
        }
      });

      bubble.appendChild(row);
    }

    // Persistent tool-use chips: a lasting record of what actually ran,
    // appended to toolsRow and updated in place once each tool resolves —
    // distinct from the transient "Searching the web…" status text, which
    // gets overwritten by the next thing that happens.
    function addToolChip(toolsRow, pendingToolChips, name) {
      const chip = document.createElement("span");
      chip.className = "tool-chip";
      const spinner = document.createElement("span");
      spinner.className = "tool-chip-spinner";
      const label = document.createElement("span");
      label.textContent = (TOOL_LABELS[name] || `⚙️ ${name}`).replace(/…$/, "");
      chip.appendChild(spinner);
      chip.appendChild(label);
      toolsRow.appendChild(chip);
      pendingToolChips.push(chip);
    }

    function resolveToolChip(pendingToolChips, ok) {
      const chip = pendingToolChips.shift();
      if (!chip) return; // defensive — shouldn't happen, tool_call/tool_result events are paired 1:1
      chip.classList.add(ok ? "ok" : "error");
      const mark = document.createElement("span");
      mark.className = "tool-chip-mark";
      mark.textContent = ok ? "✓" : "✗";
      chip.querySelector(".tool-chip-spinner")?.replaceWith(mark);
    }

    function renderInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      out = out.replace(/(?<!href=")(?<!>)(https?:\/\/[^\s<")]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      return out;
    }

    function renderMarkdown(raw) {
      const lines = raw.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let i = 0;
      const paraBuf = [];

      function flushParagraph() {
        if (paraBuf.length) {
          html += `<p>${renderInline(paraBuf.join(" "))}</p>`;
          paraBuf.length = 0;
        }
      }

      while (i < lines.length) {
        const line = lines[i];

        const fenceMatch = line.match(/^```(\w*)\s*$/);
        if (fenceMatch) {
          flushParagraph();
          const lang = fenceMatch[1] || "text";
          const codeLines = [];
          i++;
          while (i < lines.length && !/^```\s*$/.test(lines[i])) {
            codeLines.push(lines[i]);
            i++;
          }
          i++;
          const codeId = "code-" + Math.random().toString(36).slice(2, 9);
          html += `<div class="code-block"><div class="code-block-header"><span>${escapeHtml(lang)}</span><button type="button" class="copy-btn" data-copy-target="${codeId}">Copy</button></div><pre><code id="${codeId}">${escapeHtml(codeLines.join("\n"))}</code></pre></div>`;
          continue;
        }

        if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])) {
          flushParagraph();
          const splitRow = (row) =>
            row.split("|").map((c) => c.trim()).filter((c, idx, arr) => !(c === "" && (idx === 0 || idx === arr.length - 1)));
          const headerCells = splitRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim() !== "") {
            rows.push(splitRow(lines[i]));
            i++;
          }
          html += "<div class=\"table-wrap\"><table><thead><tr>" +
            headerCells.map((c) => `<th>${renderInline(c)}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => `<td>${renderInline(c)}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>";
          continue;
        }

        const headerMatch = line.match(/^(#{1,4})\s+(.*)$/);
        if (headerMatch) {
          flushParagraph();
          const level = Math.min(headerMatch[1].length + 1, 4);
          html += `<h${level}>${renderInline(headerMatch[2])}</h${level}>`;
          i++;
          continue;
        }

        if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
          flushParagraph();
          html += "<hr>";
          i++;
          continue;
        }

        if (/^\s*>\s?/.test(line)) {
          flushParagraph();
          const quoteLines = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
            quoteLines.push(lines[i].replace(/^\s*>\s?/, ""));
            i++;
          }
          html += `<blockquote>${renderInline(quoteLines.join(" "))}</blockquote>`;
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          flushParagraph();
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
            i++;
          }
          html += "<ul>" + items.map((it) => `<li>${renderInline(it)}</li>`).join("") + "</ul>";
          continue;
        }

        if (/^\s*\d+[.)]\s+/.test(line)) {
          flushParagraph();
          const items = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
            i++;
          }
          html += "<ol>" + items.map((it) => `<li>${renderInline(it)}</li>`).join("") + "</ol>";
          continue;
        }

        if (line.trim() === "") {
          flushParagraph();
          i++;
          continue;
        }

        paraBuf.push(line.trim());
        i++;
      }
      flushParagraph();
      return html;
    }

    // copy-to-clipboard for code blocks (event delegation, bubbles are created dynamically)
    chatEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".copy-btn");

      navigator.clipboard.writeText(codeEl.textContent).then(() => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });

    async function uploadFile(file) {
      if (!file) return;
      if (!file.type.includes("pdf") && !file.name.toLowerCase().endsWith(".pdf")) {
        addMessage("system", "Only PDF files are supported.");
        return;
      }
      if (file.size > 10 * 1024 * 1024) {

        return;

      attachName.textContent = "Uploading…";
      attachChip.classList.add("show");

        const res = await fetch("/upload", {
          method: "POST",

        });
        if (!res.ok) {

          addMessage("system", "Upload failed: " + err);
          setAttachment(null);
          return;

        const data = await res.json();
        setAttachment(data.filename);
      } catch (e) {
        addMessage("system", "Upload failed: " + e.message);
        setAttachment(null);
      }
    }
