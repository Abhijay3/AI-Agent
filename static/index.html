<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhijay's AI</title>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #05040d;
    --bg-1: #0b0620;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-border: rgba(255, 255, 255, 0.09);
    --surface-hover: rgba(255, 255, 255, 0.075);
    --text: #ece9fb;
    --text-dim: #9a92c4;
    --text-faint: #6a638f;
    --accent-1: #7c5cff;
    --accent-2: #22d3ee;
    --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --online: #34e5a8;
    --danger: #ff6b81;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- animated space background ---------- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-1), var(--bg-0) 60%);
  }

  .nebula {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .nebula.a {
    width: 46vw; height: 46vw;
    background: radial-gradient(circle, var(--accent-1), transparent 70%);
    top: -12vw; left: -10vw;
    animation: drift-a 34s ease-in-out infinite;
  }
  .nebula.b {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    bottom: -14vw; right: -8vw;
    animation: drift-b 40s ease-in-out infinite;
  }
  .nebula.c {
    width: 28vw; height: 28vw;
    background: radial-gradient(circle, #ff5cc4, transparent 70%);
    top: 30%; right: 15%;
    opacity: 0.18;
    animation: drift-c 46s ease-in-out infinite;
  }

  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vw, 8vw) scale(1.15); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vw, -6vw) scale(1.1); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-4vw, 5vw) scale(1.2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula { animation: none !important; }
  }

  /* ---------- icon rail ---------- */
  #iconRail {
    width: 64px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    background: rgba(8, 5, 20, 0.4);
    border-right: 1px solid var(--surface-border);
    z-index: 3;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent-grad);
    box-shadow: 0 0 18px rgba(124, 92, 255, 0.55);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #0b0620;
    margin-bottom: 4px;
  }
  .rail-btn {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .rail-btn:hover { background: var(--surface-hover); color: var(--text); }
  .rail-btn:active { transform: scale(0.94); }
  .rail-btn.primary {
    background: var(--accent-grad);
    color: #0b0620;
  }
  .rail-btn.primary:hover { filter: brightness(1.08); }
  .rail-spacer { flex: 1; }

  /* ---------- top bar (inside main area) ---------- */
  .mainHeader {
    padding: 16px 24px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 2;
  }
  .mainHeaderTitle {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    box-shadow: 0 0 0 rgba(52, 229, 168, 0);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.online {
    background: var(--online);
    box-shadow: 0 0 10px 2px rgba(52, 229, 168, 0.55);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .status-dot.offline {
    background: var(--danger);
    box-shadow: 0 0 10px 2px rgba(255, 107, 129, 0.5);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ---------- app body: rail + drawer + main ---------- */
  #appBody {
    flex: 1;
    display: none; /* shown by JS once auth is confirmed, avoids a flash of the app pre-login */
    min-height: 0;
    overflow: hidden;
  }

  /* ---------- auth screen ---------- */
  #authScreen {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    backdrop-filter: blur(16px);
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
  }
  .auth-mark {
    width: 44px; height: 44px;
    font-size: 20px;
    margin-bottom: 0;
  }
  .auth-title {
    font-size: 18px;
    font-weight: 800;
    margin: 0;
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 999px;
    padding: 3px;
    width: 100%;
  }
  .auth-tab {
    flex: 1;
    padding: 8px 0;
    border-radius: 999px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .auth-tab.active {
    background: rgba(124, 92, 255, 0.2);
    color: var(--text);
  }
  #authForm {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #authForm input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--surface-border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #authForm input:focus {
    border-color: rgba(124, 92, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
  }
  #authForm input::placeholder { color: var(--text-faint); }
  #authError {
    font-size: 12px;
    color: var(--danger);
    min-height: 14px;
    text-align: center;
  }
  #authSubmit {
    width: 100%;
    padding: 11px 0;
    border-radius: 12px;
    border: none;
    background: var(--accent-grad);
    color: #0b0620;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s;
  }
  #authSubmit:hover:not(:disabled) { filter: brightness(1.08); }
  #authSubmit:disabled { opacity: 0.6; cursor: not-allowed; }

  #sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    height: 100%;
    width: min(82vw, 300px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 10px;
    background: rgba(8, 5, 20, 0.65);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--surface-border);
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 20;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
  }
  #sidebar.open { transform: translateX(0); }

  #newChatBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid rgba(124, 92, 255, 0.4);
    background: rgba(124, 92, 255, 0.12);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #newChatBtn:hover { background: rgba(124, 92, 255, 0.22); }

  #chatList {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 8px 9px 12px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .chat-item:hover { background: var(--surface-hover); }
  .chat-item.active {
    background: rgba(124, 92, 255, 0.15);
    color: var(--text);
  }
  .chat-item-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item-close {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 6px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .chat-item:hover .chat-item-close,
  .chat-item.active .chat-item-close { opacity: 1; }
  .chat-item-close:hover { color: var(--danger); background: rgba(255, 107, 129, 0.12); }

  #sidebar::-webkit-scrollbar, #chatList::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; }

  #memoryPanel {
    border-top: 1px solid var(--surface-border);
    padding-top: 10px;
    margin-top: 4px;
    flex-shrink: 0;
  }
  #memoryToggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px;
    border-radius: 9px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  #memoryToggle:hover { background: var(--surface-hover); color: var(--text); }
  #memoryCount {
    font-size: 11px;
    color: var(--text-faint);
    background: rgba(124, 92, 255, 0.15);
    border-radius: 999px;
    padding: 1px 7px;
  }
  #memoryList {
    display: none;
    flex-direction: column;
    gap: 3px;
    margin-top: 4px;
  }
  #memoryList.open { display: flex; }
  .memory-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .memory-item:hover { background: var(--surface-hover); }
  .memory-item-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .memory-item-text b { color: var(--text); font-weight: 600; }
  .memory-item-del {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 6px;
    opacity: 0;
    flex-shrink: 0;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .memory-item:hover .memory-item-del { opacity: 1; }
  .memory-item-del:hover { color: var(--danger); background: rgba(255, 107, 129, 0.12); }
  .memory-empty {
    font-size: 12px;
    color: var(--text-faint);
    padding: 6px 8px;
  }

  #mainArea {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- chat area ---------- */
  #chatWrap {
    flex: 1;
    overflow-y: auto;
    z-index: 1;
  }
  #chat {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 100%;
  }

  /* ---------- welcome / empty-state screen ---------- */
  #welcomeScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 40px 12px;
    animation: rise 0.4s ease both;
  }
  .welcome-mark {
    width: 54px; height: 54px;
    border-radius: 16px;
    background: var(--accent-grad);
    box-shadow: 0 0 32px rgba(124, 92, 255, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #0b0620;
  }
  .welcome-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.3px;
    margin: 0;
  }
  .welcome-sub {
    font-size: 13.5px;
    color: var(--text-dim);
    max-width: 420px;
    margin: 0;
    line-height: 1.5;
  }
  .welcome-prompts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
    width: 100%;
    max-width: 560px;
  }
  .welcome-prompt {
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s;
  }
  .welcome-prompt:hover {
    background: var(--surface-hover);
    border-color: rgba(124, 92, 255, 0.4);
    color: var(--text);
    transform: translateY(-1px);
  }
  .welcome-prompt:active { transform: translateY(0) scale(0.98); }
  @media (max-width: 560px) {
    .welcome-prompts { grid-template-columns: 1fr; }
  }

  .row {
    display: flex;
    gap: 10px;
    max-width: 100%;
    animation: rise 0.35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.user { flex-direction: row-reverse; align-self: flex-end; }
  .row.ai { align-self: flex-start; }
  .row.system { align-self: center; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
  }
  .avatar.ai {
    background: var(--accent-grad);
    color: #0b0620;
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.14);
  }
  .avatar.user {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    border: 1px solid var(--surface-border);
  }

  .bubble {
    max-width: 70ch;
    padding: 12px 15px;
    border-radius: var(--radius);
    line-height: 1.55;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .row.user .bubble {
    background: var(--accent-grad);
    color: #0b0620;
    font-weight: 500;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .row.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(10px);
    border-bottom-left-radius: 4px;
    box-shadow: 0 8px 24px -16px rgba(0, 0, 0, 0.6);
  }
  .row.system .bubble {
    background: transparent;
    color: var(--text-faint);
    font-size: 12px;
    padding: 4px 10px;
    white-space: pre-wrap;
  }

  /* ---------- markdown rendering inside AI bubbles ---------- */
  .bubble > *:first-child { margin-top: 0; }
  .bubble > *:last-child { margin-bottom: 0; }
  .bubble p { margin: 8px 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 14px 0 6px;
    font-weight: 700;
    line-height: 1.3;
  }
  .bubble h1 { font-size: 1.25em; }
  .bubble h2 { font-size: 1.15em; }
  .bubble h3 { font-size: 1.05em; }
  .bubble h4 { font-size: 1em; }
  .bubble ul, .bubble ol {
    margin: 8px 0;
    padding-left: 22px;
  }
  .bubble li { margin: 3px 0; }
  .bubble blockquote {
    margin: 8px 0;
    padding: 4px 12px;
    border-left: 3px solid var(--accent-1);
    color: var(--text-dim);
  }
  .bubble hr {
    border: none;
    border-top: 1px solid var(--surface-border);
    margin: 12px 0;
  }
  .bubble code {
    background: rgba(0, 0, 0, 0.35);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: 0.9em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .bubble a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.4); }

  .table-wrap { overflow-x: auto; margin: 8px 0; }
  .bubble table {
    border-collapse: collapse;
    font-size: 0.92em;
    width: 100%;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--surface-border);
    padding: 6px 10px;
    text-align: left;
  }
  .bubble th { background: rgba(255, 255, 255, 0.05); font-weight: 600; }

  .code-block {
    margin: 10px 0;
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.3);
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid var(--surface-border);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .copy-btn {
    background: rgba(255, 255, 255, 0.06);
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }
  .copy-btn:hover { background: var(--surface-hover); color: var(--text); }
  .code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .code-block code {
    background: none;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre;
  }

  /* ---------- status / tool-activity bubble ---------- */
  .status-bubble {
    color: var(--text-dim);
    font-size: 13.5px;
    display: flex;
    align-items: center;
    min-height: 20px;
  }
  .tool-status { animation: fade-pulse 1.6s ease-in-out infinite; }
  @keyframes fade-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .typing-dots { display: inline-flex; gap: 4px; }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- input bar ---------- */
  #inputArea {
    z-index: 2;
    padding: 14px 24px 20px;
    background: linear-gradient(0deg, rgba(5,4,13,0.9) 40%, transparent);
    flex-shrink: 0;
  }
  #inputInner {
    max-width: 780px;
    margin: 0 auto;
  }

  #attachChip {
    display: none;
    align-items: center;
    gap: 8px;
    width: fit-content;
    margin: 0 0 8px 4px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  #attachChip.show { display: flex; }
  #attachChip button {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  #attachChip button:hover { color: var(--danger); }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 8px 8px 14px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #inputBar:focus-within {
    border-color: rgba(124, 92, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
  }

  #messageInput {
    flex: 1;
    resize: none;
    max-height: 160px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    padding: 8px 2px;
  }
  #messageInput::placeholder { color: var(--text-faint); }

  .icon-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.93); }
  .icon-btn.drag-over { background: rgba(124, 92, 255, 0.35); color: var(--text); }

  #sendBtn {
    background: var(--accent-grad);
    color: #0b0620;
  }
  #sendBtn:disabled {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-faint);
    cursor: not-allowed;
  }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); }

  #chatWrap.drag-over::after {
    content: "Drop a PDF to attach";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 4, 13, 0.75);
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    z-index: 5;
    border: 2px dashed var(--accent-1);
    margin: 10px;
    border-radius: 20px;
  }

  /* scrollbar */
  #chatWrap::-webkit-scrollbar { width: 8px; }
  #chatWrap::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 8px;
  }

  #sidebarBackdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(3, 2, 8, 0.6);
    z-index: 15;
  }
  #sidebarBackdrop.show { display: block; }

  /* ---------- keyboard focus ---------- */
  button:focus-visible {
    outline: 2px solid rgba(124, 92, 255, 0.65);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="stars"></div>
  <div class="nebula a"></div>
  <div class="nebula b"></div>
  <div class="nebula c"></div>

  <div id="authScreen">
    <div class="auth-card">
      <div class="brand-mark auth-mark">A</div>
      <h1 class="auth-title">Abhijay's AI</h1>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Sign in</button>
        <button type="button" class="auth-tab" data-mode="signup">Create account</button>
      </div>
      <form id="authForm">
        <input id="authEmail" type="email" placeholder="Email" autocomplete="username" required />
        <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" required minlength="8" />
        <div id="authError"></div>
        <button type="submit" id="authSubmit">Sign in</button>
      </form>
    </div>
  </div>

  <div id="appBody">
    <div id="sidebarBackdrop"></div>

    <nav id="iconRail">
      <div class="brand-mark" title="Abhijay's AI">A</div>
      <button id="railNewChat" class="rail-btn primary" type="button" title="New chat">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="railHistoryToggle" class="rail-btn" type="button" title="Chat history">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="railMemoryToggle" class="rail-btn" type="button" title="What I know about you">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2a3.5 3.5 0 0 0-3.5 3.5v.6A3 3 0 0 0 4 9v1a3 3 0 0 0 1 2.24V14a4 4 0 0 0 4 4v1a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-1a4 4 0 0 0 4-4v-1.76A3 3 0 0 0 20 10V9a3 3 0 0 0-2-2.83v-.67A3.5 3.5 0 0 0 14.5 2h-5z"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button id="railLogout" class="rail-btn" type="button" title="Sign out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>

    <aside id="sidebar">
      <button id="newChatBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <div id="chatList"></div>
      <div id="memoryPanel">
        <button id="memoryToggle" type="button">
          <span>🧠 What I know about you</span>
          <span id="memoryCount"></span>
        </button>
        <div id="memoryList"></div>
      </div>
    </aside>

    <main id="mainArea">
      <div class="mainHeader">
        <span class="mainHeaderTitle">Abhijay's AI</span>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">connecting…</span>
        </div>
      </div>
      <div id="chatWrap">
        <div id="chat"></div>
      </div>

      <div id="inputArea">
        <div id="inputInner">
          <div id="attachChip">
            <span id="attachName"></span>
            <button id="attachRemove" type="button" title="Remove attachment">✕</button>
          </div>
          <div id="inputBar">
            <button id="attachBtn" type="button" class="icon-btn" title="Attach a PDF">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <textarea id="messageInput" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
            <button id="sendBtn" type="button" class="icon-btn" title="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>

  </div>

  <script>
    // ---------- auth (real accounts, not a shared key) ----------
    const AUTH_TOKEN_KEY = "auth_token";
    let authToken = localStorage.getItem(AUTH_TOKEN_KEY);
    let userId = null; // set once /auth/me confirms the token, below

    function authHeaders(extra) {
      return Object.assign({ Authorization: `Bearer ${authToken}` }, extra || {});
    }

    const chatEl = document.getElementById("chat");
    const chatWrapEl = document.getElementById("chatWrap");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const attachChip = document.getElementById("attachChip");
    const attachName = document.getElementById("attachName");
    const attachRemove = document.getElementById("attachRemove");
    const chatListEl = document.getElementById("chatList");
    const newChatBtn = document.getElementById("newChatBtn");
    const sidebarEl = document.getElementById("sidebar");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    const railNewChat = document.getElementById("railNewChat");
    const railHistoryToggle = document.getElementById("railHistoryToggle");
    const railMemoryToggle = document.getElementById("railMemoryToggle");

    // ---------- sidebar drawer open/close (rail-triggered, all sizes) ----------
    function openSidebar() {
      sidebarEl.classList.add("open");
      sidebarBackdrop.classList.add("show");
    }
    function closeSidebar() {
      sidebarEl.classList.remove("open");
      sidebarBackdrop.classList.remove("show");
    }
    railHistoryToggle.addEventListener("click", () => {
      sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
    });
    railMemoryToggle.addEventListener("click", () => {
      openSidebar();
      document.getElementById("memoryList").classList.add("open");
      loadMemories();
    });
    sidebarBackdrop.addEventListener("click", closeSidebar);

    let attachedFilename = null;

    const TOOL_LABELS = {
      calculator: "🧮 Calculating…",
      get_weather: "🌦️ Checking the weather…",
      run_sql_query: "📦 Checking inventory…",
      web_search: "🔍 Searching the web…",
      read_pdf: "📄 Reading the PDF…",
      browse_webpage: "🌐 Browsing the page…",
      check_order_status: "📦 Looking up your order…",
      create_support_ticket: "🎫 Filing your ticket…",
    };

    // ---------- session (multi-chat) management ----------
    const SESSIONS_KEY = "chat_sessions";
    const ACTIVE_KEY = "active_session_id";

    function newSessionId() {
      return "web-" + Math.random().toString(36).slice(2, 10);
    }

    // ---------- "what I know about you" memory panel ----------
    const memoryToggle = document.getElementById("memoryToggle");
    const memoryListEl = document.getElementById("memoryList");
    const memoryCountEl = document.getElementById("memoryCount");
    let memoryPanelOpen = false;

    async function loadMemories() {
      try {
        const res = await fetch("/memories", { headers: authHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        renderMemories(data.memories || []);
      } catch {
        // silent — the panel just won't update this round
      }
    }

    function renderMemories(memories) {
      memoryCountEl.textContent = memories.length ? String(memories.length) : "";
      memoryListEl.innerHTML = "";

      if (memories.length === 0) {
        const empty = document.createElement("div");
        empty.className = "memory-empty";
        empty.textContent = "Nothing remembered yet.";
        memoryListEl.appendChild(empty);
        return;
      }

      for (const m of memories) {
        const item = document.createElement("div");
        item.className = "memory-item";

        const text = document.createElement("span");
        text.className = "memory-item-text";
        text.innerHTML = `<b>${escapeHtml(m.key)}</b>: ${escapeHtml(m.value)}`;

        const del = document.createElement("button");
        del.className = "memory-item-del";
        del.type = "button";
        del.title = "Forget this";
        del.textContent = "✕";
        del.addEventListener("click", async () => {
          del.disabled = true;
          try {
            await fetch(`/memories/${encodeURIComponent(m.key)}`, {
              method: "DELETE",
              headers: authHeaders(),
            });
            loadMemories();
          } catch {
            del.disabled = false;
          }
        });

        item.appendChild(text);
        item.appendChild(del);
        memoryListEl.appendChild(item);
      }
    }

    memoryToggle.addEventListener("click", () => {
      memoryPanelOpen = !memoryPanelOpen;
      memoryListEl.classList.toggle("open", memoryPanelOpen);
      if (memoryPanelOpen) loadMemories();
    });

    // Sessions (chat tabs) are stored per-account, so switching accounts on
    // the same browser never shows a different person's tab list.
    function sessionsStorageKey() { return `${SESSIONS_KEY}:${userId}`; }
    function activeStorageKey() { return `${ACTIVE_KEY}:${userId}`; }

    function loadSessions() {
      try {
        const raw = localStorage.getItem(sessionsStorageKey());
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch {}
      return [];
    }

    function saveSessions() {
      localStorage.setItem(sessionsStorageKey(), JSON.stringify(sessions));
    }

    let sessions = [];
    let activeId = null;

    function initSessions() {
      sessions = loadSessions();
      if (sessions.length === 0) {
        sessions = [{ id: newSessionId(), title: "New chat" }];
      }
      activeId = localStorage.getItem(activeStorageKey());
      if (!activeId || !sessions.some((s) => s.id === activeId)) {
        activeId = sessions[0].id;
      }
      saveSessions();
      localStorage.setItem(activeStorageKey(), activeId);
    }

    function renderChatList() {
      chatListEl.innerHTML = "";
      for (const s of sessions) {
        const item = document.createElement("div");
        item.className = "chat-item" + (s.id === activeId ? " active" : "");

        const label = document.createElement("span");
        label.className = "chat-item-label";
        label.textContent = s.title;
        item.addEventListener("click", () => switchSession(s.id));

        const close = document.createElement("button");
        close.type = "button";
        close.className = "chat-item-close";
        close.textContent = "✕";
        close.title = "Delete this chat";
        close.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteSession(s.id);
        });

        item.appendChild(label);
        item.appendChild(close);
        chatListEl.appendChild(item);
      }
    }

    const WELCOME_PROMPTS = [
      { icon: "📦", text: "Where is my order? It still hasn't arrived" },
      { icon: "🔄", text: "I want to return or exchange something I bought" },
      { icon: "⚠️", text: "My item arrived damaged or isn't working" },
      { icon: "💳", text: "I have a question about a charge on my account" },
    ];

    function renderWelcomeScreen() {
      const wrap = document.createElement("div");
      wrap.id = "welcomeScreen";

      const mark = document.createElement("div");
      mark.className = "welcome-mark";
      mark.textContent = "A";

      const title = document.createElement("h2");
      title.className = "welcome-title";
      title.textContent = "Hi, I'm Abhijay's AI";

      const sub = document.createElement("p");
      sub.className = "welcome-sub";
      sub.textContent = "Ask about an order, file a ticket, or just chat — I remember what you tell me, across every conversation.";

      const prompts = document.createElement("div");
      prompts.className = "welcome-prompts";
      for (const p of WELCOME_PROMPTS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "welcome-prompt";
        btn.textContent = `${p.icon}  ${p.text}`;
        btn.addEventListener("click", () => {
          inputEl.value = p.text;
          inputEl.focus();
          inputEl.dispatchEvent(new Event("input")); // grow the textarea to fit the text
        });
        prompts.appendChild(btn);
      }

      wrap.appendChild(mark);
      wrap.appendChild(title);
      wrap.appendChild(sub);
      wrap.appendChild(prompts);
      chatEl.appendChild(wrap);
    }

    async function loadActiveHistory() {
      chatEl.innerHTML = "";
      try {
        const res = await fetch(`/history/${activeId}`, { headers: authHeaders() });
        if (res.ok) {
          const data = await res.json();
          if (data.messages.length === 0) {
            renderWelcomeScreen();
          } else {
            for (const m of data.messages) {
              addMessage(m.role === "assistant" ? "ai" : "user", m.content);
            }
          }
          return;
        }
      } catch {}
      renderWelcomeScreen();
    }

    async function switchSession(id) {
      closeSidebar();
      if (id === activeId) return;
      activeId = id;
      localStorage.setItem(activeStorageKey(), activeId);
      setAttachment(null);
      renderChatList();
      await loadActiveHistory();
    }

    async function startNewChat() {
      const id = newSessionId();
      sessions.push({ id, title: "New chat" });
      saveSessions();
      await switchSession(id);
    }

    async function deleteSession(id) {
      try {
        await fetch(`/history/${id}`, { method: "DELETE", headers: authHeaders() });
      } catch {}

      sessions = sessions.filter((s) => s.id !== id);
      if (sessions.length === 0) {
        sessions = [{ id: newSessionId(), title: "New chat" }];
      }
      saveSessions();

      if (id === activeId) {
        activeId = sessions[0].id;
        localStorage.setItem(activeStorageKey(), activeId);
        renderChatList();
        await loadActiveHistory();
      } else {
        renderChatList();
      }
    }

    function updateActiveSessionTitle(text) {
      const s = sessions.find((x) => x.id === activeId);
      if (s && s.title === "New chat" && text) {
        s.title = text.length > 28 ? text.slice(0, 28) + "…" : text;
        saveSessions();
        renderChatList();
      }
    }

    newChatBtn.addEventListener("click", startNewChat);
    railNewChat.addEventListener("click", startNewChat);

    // ---------- starfield ----------
    (function initStars() {
      const canvas = document.createElement("canvas");
      canvas.style.position = "fixed";
      canvas.style.inset = "0";
      canvas.style.zIndex = "-2";
      document.getElementById("stars").appendChild(canvas);
      const ctx = canvas.getContext("2d");
      let stars = [];
      let comets = [];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function resize() {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        const count = Math.min(160, Math.floor((window.innerWidth * window.innerHeight) / 9000));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: (Math.random() * 1.3 + 0.3) * devicePixelRatio,
          baseAlpha: Math.random() * 0.6 + 0.3,
          phase: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.05 * devicePixelRatio,
        }));
      }

      function maybeSpawnComet() {
        if (reduceMotion || comets.length >= 2) return;
        if (Math.random() < 0.004) {
          comets.push({
            x: Math.random() * canvas.width * 0.7 + canvas.width * 0.15,
            y: -30 * devicePixelRatio,
            vx: (Math.random() - 0.5) * 3 * devicePixelRatio,
            vy: (4 + Math.random() * 3) * devicePixelRatio,
            len: (90 + Math.random() * 70) * devicePixelRatio,
            life: 1,
          });
        }
      }

      function drawComets() {
        for (let i = comets.length - 1; i >= 0; i--) {
          const c = comets[i];
          c.x += c.vx;
          c.y += c.vy;
          c.life -= 0.012;
          if (c.life <= 0 || c.y - c.len > canvas.height) {
            comets.splice(i, 1);
            continue;
          }
          const angle = Math.atan2(c.vy, c.vx);
          const tailX = c.x - Math.cos(angle) * c.len;
          const tailY = c.y - Math.sin(angle) * c.len;
          const grad = ctx.createLinearGradient(c.x, c.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255, 255, 255, ${c.life})`);
          grad.addColorStop(0.4, `rgba(180, 170, 255, ${c.life * 0.5})`);
          grad.addColorStop(1, "rgba(124, 92, 255, 0)");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2 * devicePixelRatio;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();
        }
      }

      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const twinkle = reduceMotion ? s.baseAlpha : s.baseAlpha * (0.6 + 0.4 * Math.sin(t / 900 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(230, 225, 255, ${twinkle})`;
          ctx.fill();
          if (!reduceMotion) {
            s.y += s.drift;
            if (s.y > canvas.height) s.y = 0;
            if (s.y < 0) s.y = canvas.height;
          }
        }
        maybeSpawnComet();
        drawComets();
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(draw);
    })();

    // ---------- markdown rendering ----------
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      out = out.replace(/(?<!href=")(?<!>)(https?:\/\/[^\s<")]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      return out;
    }

    function renderMarkdown(raw) {
      const lines = raw.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let i = 0;
      const paraBuf = [];

      function flushParagraph() {
        if (paraBuf.length) {
          html += `<p>${renderInline(paraBuf.join(" "))}</p>`;
          paraBuf.length = 0;
        }
      }

      while (i < lines.length) {
        const line = lines[i];

        const fenceMatch = line.match(/^```(\w*)\s*$/);
        if (fenceMatch) {
          flushParagraph();
          const lang = fenceMatch[1] || "text";
          const codeLines = [];
          i++;
          while (i < lines.length && !/^```\s*$/.test(lines[i])) {
            codeLines.push(lines[i]);
            i++;
          }
          i++;
          const codeId = "code-" + Math.random().toString(36).slice(2, 9);
          html += `<div class="code-block"><div class="code-block-header"><span>${escapeHtml(lang)}</span><button type="button" class="copy-btn" data-copy-target="${codeId}">Copy</button></div><pre><code id="${codeId}">${escapeHtml(codeLines.join("\n"))}</code></pre></div>`;
          continue;
        }

        if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])) {
          flushParagraph();
          const splitRow = (row) =>
            row.split("|").map((c) => c.trim()).filter((c, idx, arr) => !(c === "" && (idx === 0 || idx === arr.length - 1)));
          const headerCells = splitRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim() !== "") {
            rows.push(splitRow(lines[i]));
            i++;
          }
          html += "<div class=\"table-wrap\"><table><thead><tr>" +
            headerCells.map((c) => `<th>${renderInline(c)}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => `<td>${renderInline(c)}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>";
          continue;
        }

        const headerMatch = line.match(/^(#{1,4})\s+(.*)$/);
        if (headerMatch) {
          flushParagraph();
          const level = Math.min(headerMatch[1].length + 1, 4);
          html += `<h${level}>${renderInline(headerMatch[2])}</h${level}>`;
          i++;
          continue;
        }

        if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
          flushParagraph();
          html += "<hr>";
          i++;
          continue;
        }

        if (/^\s*>\s?/.test(line)) {
          flushParagraph();
          const quoteLines = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
            quoteLines.push(lines[i].replace(/^\s*>\s?/, ""));
            i++;
          }
          html += `<blockquote>${renderInline(quoteLines.join(" "))}</blockquote>`;
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          flushParagraph();
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
            i++;
          }
          html += "<ul>" + items.map((it) => `<li>${renderInline(it)}</li>`).join("") + "</ul>";
          continue;
        }

        if (/^\s*\d+[.)]\s+/.test(line)) {
          flushParagraph();
          const items = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
            i++;
          }
          html += "<ol>" + items.map((it) => `<li>${renderInline(it)}</li>`).join("") + "</ol>";
          continue;
        }

        if (line.trim() === "") {
          flushParagraph();
          i++;
          continue;
        }

        paraBuf.push(line.trim());
        i++;
      }
      flushParagraph();
      return html;
    }

    // copy-to-clipboard for code blocks (event delegation, bubbles are created dynamically)
    chatEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".copy-btn");
      if (!btn) return;
      const codeEl = document.getElementById(btn.dataset.copyTarget);
      if (!codeEl) return;
      navigator.clipboard.writeText(codeEl.textContent).then(() => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "row " + role;

      if (role !== "system") {
        const avatar = document.createElement("div");
        avatar.className = "avatar " + role;
        avatar.textContent = role === "ai" ? "A" : "U";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = role === "ai" ? renderMarkdown(text) : escapeHtml(text);
      row.appendChild(bubble);

      chatEl.appendChild(row);
      chatWrapEl.scrollTop = chatWrapEl.scrollHeight;
      return row;
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          statusDot.className = "status-dot online";
          statusText.textContent = "online";
        } else {
          throw new Error();
        }
      } catch {
        statusDot.className = "status-dot offline";
        statusText.textContent = "unreachable";
      }
    }
    checkHealth();

    // ---------- auto-growing textarea ----------
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ---------- file attach ----------
    function setAttachment(filename) {
      attachedFilename = filename;
      attachName.textContent = filename ? `📎 ${filename}` : "";
      attachChip.classList.toggle("show", !!filename);
    }

    async function uploadFile(file) {
      if (!file) return;
      if (!file.type.includes("pdf") && !file.name.toLowerCase().endsWith(".pdf")) {
        addMessage("system", "Only PDF files are supported.");
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        addMessage("system", "File too large (max 10MB).");
        return;
      }

      attachName.textContent = "Uploading…";
      attachChip.classList.add("show");

      try {
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/upload", {
          method: "POST",
          headers: authHeaders(),
          body: form,
        });
        if (!res.ok) {
          const err = await res.text();
          addMessage("system", "Upload failed: " + err);
          setAttachment(null);
          return;
        }
        const data = await res.json();
        setAttachment(data.filename);
      } catch (e) {
        addMessage("system", "Upload failed: " + e.message);
        setAttachment(null);
      }
    }

    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) uploadFile(fileInput.files[0]);
      fileInput.value = "";
    });
    attachRemove.addEventListener("click", () => setAttachment(null));

    ["dragenter", "dragover"].forEach((evt) =>
      chatWrapEl.addEventListener(evt, (e) => {
        e.preventDefault();
        chatWrapEl.classList.add("drag-over");
      })
    );
    ["dragleave", "drop"].forEach((evt) =>
      chatWrapEl.addEventListener(evt, (e) => {
        e.preventDefault();
        chatWrapEl.classList.remove("drag-over");
      })
    );
    chatWrapEl.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      if (file) uploadFile(file);
    });

    // ---------- send (streaming) ----------
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text && !attachedFilename) return;

      document.getElementById("welcomeScreen")?.remove();

      const displayText = attachedFilename ? `📎 ${attachedFilename}\n${text}` : text;
      addMessage("user", displayText || `📎 ${attachedFilename}`);
      updateActiveSessionTitle(text || attachedFilename);

      const payload = attachedFilename
        ? `[Attached file: ${attachedFilename}]\n${text}`
        : text;
      const targetSessionId = activeId;

      inputEl.value = "";
      inputEl.style.height = "auto";
      setAttachment(null);
      sendBtn.disabled = true;

      // placeholder AI row: starts as "thinking" dots, becomes tool-status
      // text, then morphs into the streamed markdown answer.
      const statusRow = document.createElement("div");
      statusRow.className = "row ai";
      const avatar = document.createElement("div");
      avatar.className = "avatar ai";
      avatar.textContent = "A";
      const bubble = document.createElement("div");
      bubble.className = "bubble status-bubble";
      bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
      statusRow.appendChild(avatar);
      statusRow.appendChild(bubble);
      chatEl.appendChild(statusRow);
      chatWrapEl.scrollTop = chatWrapEl.scrollHeight;

      let answerText = "";
      let answerStarted = false;
      let settled = false;

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ session_id: targetSessionId, message: payload }),
        });

        if (!res.ok || !res.body) {
          const err = await res.text();
          if (targetSessionId === activeId) {
            statusRow.remove();
            addMessage("system", "Error: " + err);
          }
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n");
          buffer = parts.pop();

          for (const line of parts) {
            if (!line.trim()) continue;
            let evt;
            try {
              evt = JSON.parse(line);
            } catch {
              continue;
            }

            if (targetSessionId !== activeId) continue; // tab switched mid-stream; keep draining, skip UI

            if (evt.event === "tool_call") {
              bubble.className = "bubble status-bubble";
              bubble.innerHTML = `<span class="tool-status">${TOOL_LABELS[evt.tool] || "⚙️ Working…"}</span>`;
            } else if (evt.event === "token") {
              if (!answerStarted) {
                answerStarted = true;
                bubble.className = "bubble";
              }
              answerText += evt.text;
              bubble.innerHTML = renderMarkdown(answerText);
              chatWrapEl.scrollTop = chatWrapEl.scrollHeight;
            } else if (evt.event === "content_replace") {
              // Backend detected a malformed response after the fact
              // (e.g. a leaked pseudo tool-call) and swapped in a clean
              // message — discard whatever had streamed in so far.
              answerStarted = true;
              answerText = evt.text;
              bubble.className = "bubble";
              bubble.innerHTML = renderMarkdown(answerText);
            } else if (evt.event === "error") {
              settled = true;
              statusRow.remove();
              addMessage("system", "Error: " + evt.message);
            }
          }
        }

        if (targetSessionId === activeId && !answerStarted && !settled) {
          // stream ended with nothing to show (shouldn't normally happen)
          statusRow.remove();
        }
      } catch (e) {
        if (targetSessionId === activeId) {
          statusRow.remove();
          addMessage("system", "Network error: " + e.message);
        }
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
        loadMemories();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    // ---------- auth screen wiring ----------
    const authScreenEl = document.getElementById("authScreen");
    const appBodyEl = document.getElementById("appBody");
    const authFormEl = document.getElementById("authForm");
    const authEmailEl = document.getElementById("authEmail");
    const authPasswordEl = document.getElementById("authPassword");
    const authErrorEl = document.getElementById("authError");
    const authSubmitEl = document.getElementById("authSubmit");
    const authTabs = document.querySelectorAll(".auth-tab");
    const railLogout = document.getElementById("railLogout");

    let authMode = "login";

    function showAuthScreen() {
      authScreenEl.style.display = "flex";
      appBodyEl.style.display = "none";
    }

    function showApp() {
      authScreenEl.style.display = "none";
      appBodyEl.style.display = "flex";
    }

    function initApp() {
      initSessions();
      renderChatList();
      loadActiveHistory();
      loadMemories();
    }

    authTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        authTabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        authMode = tab.dataset.mode;
        authSubmitEl.textContent = authMode === "login" ? "Sign in" : "Create account";
        authErrorEl.textContent = "";
      });
    });

    authFormEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      authErrorEl.textContent = "";
      authSubmitEl.disabled = true;

      try {
        const res = await fetch(authMode === "login" ? "/auth/login" : "/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: authEmailEl.value.trim(), password: authPasswordEl.value }),
        });
        const data = await res.json();
        if (!res.ok) {
          authErrorEl.textContent = data.detail || "Something went wrong.";
          return;
        }
        authToken = data.token;
        userId = data.user_id;
        localStorage.setItem(AUTH_TOKEN_KEY, authToken);
        authPasswordEl.value = "";
        showApp();
        initApp();
      } catch (err) {
        authErrorEl.textContent = "Network error: " + err.message;
      } finally {
        authSubmitEl.disabled = false;
      }
    });

    railLogout.addEventListener("click", async () => {
      try {
        await fetch("/auth/logout", { method: "POST", headers: authHeaders() });
      } catch {}
      authToken = null;
      userId = null;
      localStorage.removeItem(AUTH_TOKEN_KEY);
      showAuthScreen();
    });

    async function checkAuthAndInit() {
      if (!authToken) {
        showAuthScreen();
        return;
      }
      try {
        const res = await fetch("/auth/me", { headers: authHeaders() });
        if (!res.ok) {
          authToken = null;
          localStorage.removeItem(AUTH_TOKEN_KEY);
          showAuthScreen();
          return;
        }
        const data = await res.json();
        userId = data.user_id;
        showApp();
        initApp();
      } catch {
        showAuthScreen();
      }
    }

    checkAuthAndInit();
  </script>
</body>
</html>
