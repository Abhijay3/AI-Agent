    // ---------- send (streaming) ----------
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text && !attachedFilename) return;

      if (document.getElementById("welcomeScreen")) {
        destroyLandingScreen();
        document.getElementById("welcomeScreen").remove();
      }

      const displayText = attachedFilename ? `📎 ${attachedFilename}\n${text}` : text;
      addMessage("user", displayText || `📎 ${attachedFilename}`);
      updateActiveSessionTitle(text || attachedFilename);

      const payload = attachedFilename
        ? `[Attached file: ${attachedFilename}]\n${text}`
        : text;
      const targetSessionId = activeId;

      inputEl.value = "";
      inputEl.style.height = "auto";
      setAttachment(null);
      sendBtn.disabled = true;

      // placeholder AI row: starts as "thinking" dots, becomes tool-status
      // text, then morphs into the streamed markdown answer. toolsRow holds
      // a persistent, growing record of which tools actually ran — separate
      // from the transient status text, which keeps changing as the turn
      // progresses.
      const statusRow = document.createElement("div");
      statusRow.className = "row ai";
      const avatar = document.createElement("div");
      avatar.className = "avatar ai";
      avatar.textContent = "A";
      const contentCol = document.createElement("div");
      contentCol.className = "ai-content-col";
      const toolsRow = document.createElement("div");
      toolsRow.className = "tools-used";
      const bubble = document.createElement("div");
      bubble.className = "bubble status-bubble";
      bubble.innerHTML = '<span class="tool-status">Thinking…</span> <span class="typing-dots"><span></span><span></span><span></span></span>';
      contentCol.appendChild(toolsRow);
      contentCol.appendChild(bubble);
      statusRow.appendChild(avatar);
      statusRow.appendChild(contentCol);
      chatEl.appendChild(statusRow);
      chatWrapEl.scrollTop = chatWrapEl.scrollHeight;

      let answerText = "";
      let answerStarted = false;
      let settled = false;
      let sources = [];
      const pendingToolChips = []; // FIFO — tool_call/tool_result events arrive in matching order

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ session_id: targetSessionId, message: payload }),
        });

        if (!res.ok || !res.body) {
          // Errors from our own API come back as JSON ({"detail": "..."}).
          // Errors from an upstream proxy (e.g. Render returning a 502 while
          // the app restarts) come back as a full HTML error page instead —
          // never show that raw markup to the user.
          let message = "Something went wrong. Please try again.";
          try {
            const data = await res.json();
            if (data?.detail) message = data.detail;
          } catch {
            // not JSON — keep the generic message
          }
          if (targetSessionId === activeId) {
            statusRow.remove();
            addMessage("system", "Error: " + message);
          }
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n");
          buffer = parts.pop();

          for (const line of parts) {
            if (!line.trim()) continue;
            let evt;
            try {
              evt = JSON.parse(line);
            } catch {
              continue;
            }

            if (targetSessionId !== activeId) continue; // tab switched mid-stream; keep draining, skip UI

            if (evt.event === "tool_call") {
              bubble.className = "bubble status-bubble";
              bubble.innerHTML = `<span class="tool-status">${TOOL_LABELS[evt.tool] || "⚙️ Working…"}</span>`;
              addToolChip(toolsRow, pendingToolChips, evt.tool);
            } else if (evt.event === "tool_result") {
              resolveToolChip(pendingToolChips, evt.ok);
            } else if (evt.event === "client_action") {
              // The backend is a cloud container — it can't open anything
              // on the user's actual machine, only ask their browser to.
              if (evt.action === "open_url" && evt.url) {
                window.open(evt.url, "_blank", "noopener,noreferrer");
              }
            } else if (evt.event === "token") {
              if (!answerStarted) {
                answerStarted = true;
                bubble.className = "bubble";
              }
              answerText += evt.text;
              bubble.innerHTML = renderMarkdown(answerText);
              chatWrapEl.scrollTop = chatWrapEl.scrollHeight;
            } else if (evt.event === "content_replace") {
              // Backend detected a malformed response after the fact
              // (e.g. a leaked pseudo tool-call) and swapped in a clean
              // message — discard whatever had streamed in so far.
              answerStarted = true;
              answerText = evt.text;
              bubble.className = "bubble";
              bubble.innerHTML = renderMarkdown(answerText);
            } else if (evt.event === "error") {
              settled = true;
              statusRow.remove();
              addMessage("system", "Error: " + evt.message);
            } else if (evt.event === "sources") {
              // De-dupe by url (web sources) or title (RAG/document sources,
              // which have no url) in case the model searched/retrieved more
              // than once — rendered once, after streaming finishes, below.
              for (const s of evt.sources) {
                const key = s.url || s.title;
                if (!sources.some((existing) => (existing.url || existing.title) === key)) sources.push(s);
              }
            }
          }
        }

        if (targetSessionId === activeId && !answerStarted && !settled) {
          // stream ended with nothing to show (shouldn't normally happen)
          statusRow.remove();
        } else if (targetSessionId === activeId && answerStarted && sources.length) {
          appendSources(bubble, sources);
        }
      } catch (e) {
        if (targetSessionId === activeId) {
          statusRow.remove();
          addMessage("system", "Network error: " + e.message);
        }
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
        loadMemories();
      }
    }

      initSessions();
      renderChatList();
      loadActiveHistory();
      loadMemories();
    }

    authTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        authTabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        authMode = tab.dataset.mode;
        authSubmitEl.textContent = authMode === "login" ? "Sign in" : "Create account";
        authErrorEl.textContent = "";
      });
    });

    authFormEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      authErrorEl.textContent = "";
      authSubmitEl.disabled = true;

      try {
        const res = await fetch(authMode === "login" ? "/auth/login" : "/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: authEmailEl.value.trim(), password: authPasswordEl.value }),
        });
        // A non-JSON body here (e.g. an HTML error page from an upstream
        // proxy) would otherwise throw inside the outer catch and surface a
        // raw "Unexpected token '<'..." parse error to the user.
        let data = null;
        try {
          data = await res.json();
        } catch {
          // fall through to the generic message below
        }
        if (!res.ok || !data) {
          authErrorEl.textContent = data?.detail || "Something went wrong. Please try again.";
          return;
        }
        authToken = data.token;
        userId = data.user_id;
        userEmail = data.email;
        localStorage.setItem(AUTH_TOKEN_KEY, authToken);
        authPasswordEl.value = "";
        showApp();
        initApp();
      } catch (err) {
        authErrorEl.textContent = "Network error: " + err.message;
      } finally {
        authSubmitEl.disabled = false;
      }
    });

    railLogout.addEventListener("click", async () => {
      try {
        await fetch("/auth/logout", { method: "POST", headers: authHeaders() });
      } catch {}
      authToken = null;
      userId = null;
      localStorage.removeItem(AUTH_TOKEN_KEY);
      showAuthScreen();
    });

    async function checkAuthAndInit() {
      if (!authToken) {
        showAuthScreen();
        return;
      }
      try {
        const res = await fetch("/auth/me", { headers: authHeaders() });
        if (!res.ok) {
          authToken = null;
          localStorage.removeItem(AUTH_TOKEN_KEY);
          showAuthScreen();
          return;
        }
        const data = await res.json();
        userId = data.user_id;
        userEmail = data.email;
        showApp();
        initApp();
      } catch {
        showAuthScreen();
      }
    }

    checkAuthAndInit();
  </script>
</body>
</html>
